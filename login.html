/* ================= community posts (Firestore: posts, reports, admins) ================= */
const POST_TYPES=['cleanup','resources','hazard'];
const PST={list:null,mine:[],pending:[],reports:[],err:null,loading:false};
const shortName=n=>{const p=String(n||'').trim().split(/\s+/);return p.length>1?`${p[0]} ${p[p.length-1][0]}.`:(p[0]||'SAFAST member')};
async function checkAdmin(){
  ACC.isAdmin=false;
  if(ACC.mode!=='firebase'||!ACC.user) return;
  try{const d=await ACC.fb.db.collection('admins').doc(ACC.user.uid).get();ACC.isAdmin=d.exists}catch(e){}
}
const demoPosts=()=>store.get('demoPosts',[]);
const Posts={
  async approved(){
    if(ACC.mode==='firebase'){
      const q=await ACC.fb.db.collection('posts').where('status','==','approved').orderBy('createdAt','desc').limit(30).get();
      return q.docs.map(d=>({id:d.id,...d.data()}));
    }
    return demoPosts().filter(p=>p.status==='approved').sort((a,b)=>b.createdAt-a.createdAt);
  },
  async mine(){
    if(!ACC.user) return [];
    if(ACC.mode==='firebase'){
      const q=await ACC.fb.db.collection('posts').where('authorUid','==',ACC.user.uid).where('status','==','pending').get();
      return q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);
    }
    return demoPosts().filter(p=>p.authorUid===ACC.user.uid&&p.status==='pending');
  },
  async pending(){
    if(!ACC.isAdmin) return [];
    const q=await ACC.fb.db.collection('posts').where('status','==','pending').orderBy('createdAt','asc').limit(50).get();
    return q.docs.map(d=>({id:d.id,...d.data()}));
  },
  async reports(){
    if(!ACC.isAdmin) return [];
    const q=await ACC.fb.db.collection('reports').orderBy('createdAt','desc').limit(50).get();
    return q.docs.map(d=>({id:d.id,...d.data()}));
  },
  async create(d){
    const post={type:d.type,title:d.title,loc:d.loc,details:d.details,authorUid:ACC.user.uid,authorName:shortName(ACC.profile&&ACC.profile.name),status:'pending',createdAt:Date.now()};
    if(ACC.mode==='firebase'){await ACC.fb.db.collection('posts').add(post);return 'pending'}
    // demo mode has no admins, so demo posts are approved straight away
    const all=demoPosts(); all.unshift({...post,id:'d'+Date.now().toString(36),status:'approved'}); store.set('demoPosts',all.slice(0,50)); return 'approved';
  },
  async remove(id){
    if(ACC.mode==='firebase'){await ACC.fb.db.collection('posts').doc(id).delete();return}
    store.set('demoPosts',demoPosts().filter(p=>p.id!==id));
  },
  async approve(id){ await ACC.fb.db.collection('posts').doc(id).update({status:'approved',approvedAt:Date.now()}) },
  async report(post){
    if(ACC.mode==='firebase'){await ACC.fb.db.collection('reports').doc(`${post.id}_${ACC.user.uid}`).set({postId:post.id,postTitle:post.title,uid:ACC.user.uid,createdAt:Date.now()});return}
  },
  async dismiss(id){ await ACC.fb.db.collection('reports').doc(id).delete() }
};
async function loadPosts(){
  if(PST.loading) return; PST.loading=true; PST.err=null;
  try{
    if(ACC.mode==='firebase'&&!ACC.ready){PST.loading=false;return}
    const [a,m,pe,re]=await Promise.all([Posts.approved(),Posts.mine().catch(()=>[]),Posts.pending().catch(()=>[]),Posts.reports().catch(()=>[])]);
    PST.list=a;PST.mine=m;PST.pending=pe;PST.reports=re;
  }catch(e){PST.list=PST.list||[];PST.err=e.code||'error'}
  PST.loading=false;
  if(cur().name==='community') renderPosts();
}
function renderPosts(){
  const box=document.getElementById('posts'); if(box) box.innerHTML=postsHtml();

  const adm=document.getElementById('modpanel'); if(adm) adm.outerHTML=modHtml();
}
const typeName=k=>({cleanup:t('cleanup'),resources:t('resources'),hazard:t('hazard')}[k]||k);
function postCard(p,mode){
  const own=ACC.user&&p.authorUid===ACC.user.uid;
  const acts=[];
  if(mode==='public'){
    if(ACC.user&&!own&&ACC.mode==='firebase') acts.push(`<button class="linkbtn" data-action="post-report" data-v="${esc(p.id)}">${ic('flag','icon')}${t('report')}</button>`);
    if(own||ACC.isAdmin) acts.push(`<button class="linkbtn linkbtn--bad" data-action="post-del" data-v="${esc(p.id)}">${ic('trash','icon')}${t('delete')}</button>`);
  }else if(mode==='mine'){
    acts.push(`<button class="linkbtn linkbtn--bad" data-action="post-del" data-v="${esc(p.id)}">${ic('trash','icon')}${t('delete')}</button>`);
  }else if(mode==='review'){
    acts.push(`<button class="btn btn--primary btn--sm" data-action="post-approve" data-v="${esc(p.id)}">${ic('check')}${t('approve')}</button>`,`<button class="btn btn--ghost btn--sm" data-action="post-del" data-v="${esc(p.id)}">${ic('trash')}${t('delete')}</button>`);
  }
  return `<article class="post">
    <div class="post__top"><span class="level ${p.type==='hazard'?'lv-warn':p.type==='resources'?'lv-adv':'lv-ok'}">${esc(typeName(p.type))}</span>${mode==='mine'?`<span class="level lv-info">${t('inReview')}</span>`:''}<span class="post__when">${esc(ago(new Date(p.createdAt).toISOString()))}</span></div>
    <h3>${esc(p.title)}</h3>
    ${p.loc?`<p class="post__loc">${ic('pin','icon')}<span>${esc(p.loc)}</span></p>`:''}
    ${p.details?`<p class="post__body">${esc(p.details)}</p>`:''}
    <div class="post__foot"><span class="note">${t('postedBy',esc(p.authorName||'SAFAST member'))}</span>${acts.length?`<div class="post__acts${mode==='review'?' post__acts--review':''}">${acts.join('')}</div>`:''}</div>
  </article>`;
}
function postsHtml(){
  if(PST.list==null) return `<div class="empty"><span class="dot" style="background:var(--surface-2);color:var(--muted)">${ic('refresh')}</span><span>${t('checking')}</span></div>`;
  if(PST.err&&!PST.list.length) return `<div class="empty"><span class="dot" style="background:var(--surface-2);color:var(--muted)">${ic('community')}</span><span>${t('postsErr')}</span></div>`;
  if(!PST.list.length) return `<div class="empty"><span class="dot" style="background:var(--surface-2);color:var(--muted)">${ic('community')}</span><span>${t('noUpdates')}</span></div>`;
  return `<div class="posts">${PST.list.map(p=>postCard(p,'public')).join('')}</div>`;
}
function myPostsHtml(){
  if(!PST.mine.length) return '<div id="myposts" hidden></div>';

function modHtml(){
  if(!ACC.isAdmin) return '<div id="modpanel" hidden></div>';
  const rep=PST.reports.map(r=>`<div class="report"><div><b>${esc(r.postTitle||r.postId)}</b><span class="note">${t('reportedAgo',esc(ago(new Date(r.createdAt).toISOString())))}</span></div><div class="post__acts"><button class="linkbtn linkbtn--bad" data-action="post-del" data-v="${esc(r.postId)}" data-r="${esc(r.id)}">${ic('trash','icon')}${t('deletePost')}</button><button class="linkbtn" data-action="report-dismiss" data-v="${esc(r.id)}">${ic('check','icon')}${t('dismiss')}</button></div></div>`).join('');

    <h3 class="label">${t('awaiting',PST.pending.length)}</h3>

    <h3 class="label" style="margin-top:8px">${t('reportsN',PST.reports.length)}</h3>

/* ================= router ================= */
const NAV=['home','education','map','disasters','community','profile'];
const PATH={home:'/',education:'/education',map:'/map',disasters:'/disasters',community:'/community',profile:'/profile'};
let current = ON_SITE ? location.pathname : '/';
function parse(path){
  path=(path||'/').replace(/\/index\.html$/,'/').replace(/\.html$/,'').replace(/\/+$/,'')||'/';
  let m;
  if((m=path.match(/^\/disasters\/([a-z0-9-]+)$/))) return DISASTERS.some(d=>d.slug===m[1])?{name:'disasters',slug:m[1],tab:'disasters'}:{name:'404'};
  for(const k of NAV) if(PATH[k]===path) return {name:k,tab:k};
  const X={'/login':'login','/signup':'signup','/privacy':'privacy','/terms':'terms'}[path]; if(X) return {name:X,tab:X==='login'||X==='signup'?'profile':''};
  return {name:'404'};
}
const cur=()=>parse(current);
function go(path){
  if(path===current) {window.scrollTo({top:0});return}
  current=path;
  if(ON_SITE){try{history.pushState({},'',path)}catch(e){}}
  closeOverlay(); S.delArm=false; render(true);
}
window.addEventListener('popstate',()=>{current=location.pathname;render(true)});

function pickVoice(lang){

    const pool=exact.length?exact:v;
    return pool.find(x=>/natural|neural|premium|enhanced/i.test(x.name))||pool.find(x=>/Google|Samantha|Aria|Jenny|Yuna|SunHi|Heami/i.test(x.name))||pool[0]||null;}catch(e){return null}

function ttsUi(){

  el.innerHTML=`<div class="mapfb"><svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="800" height="450" fill="var(--surface-2)"/>${lines}<path d="M-20 210 C 140 170, 260 260, 420 205 S 680 150, 820 190" stroke="var(--wx-cloud)" stroke-width="26" fill="none" opacity=".55"/><circle cx="400" cy="225" r="46" fill="var(--accent)" opacity=".12"/><circle cx="400" cy="225" r="11" fill="var(--accent)" stroke="var(--surface)" stroke-width="4"/></svg><span class="mapfb__note">${t('mapFb')}</span></div>`;
}
let mapObj=null; const mapPins={shelters:[]};
function focusShelter(i,fromList){
  const s=S.shelters&&S.shelters.list[i]; if(!s) return;
  document.querySelectorAll('.shelter.is-on').forEach(x=>x.classList.remove('is-on'));
  const card=document.getElementById('sh-'+i); if(card){card.classList.add('is-on'); if(!fromList) card.scrollIntoView({behavior:'smooth',block:'center'})}
  if(fromList){document.getElementById('map')?.scrollIntoView({behavior:'smooth',block:'center'})}
  if(mapObj){try{mapObj.setView([s.lat,s.lon],14)}catch(e){}}
  document.querySelectorAll('.ap-shelter').forEach((x,k)=>x.classList.toggle('is-on',k===i));
}
function initMap(){
  const el=document.getElementById('map'); if(!el) return;
  if(mapObj){try{mapObj.remove()}catch(e){} mapObj=null}
  const loc=S.loc||DEFAULT_LOC;
  const LF=window.L; if(!LF||typeof LF.map!=='function'){mapFallback(el);return}
  try{
    const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
    mapObj=LF.map(el,{zoomControl:true,attributionControl:true}).setView([loc.lat,loc.lon],12);
    let ok=false;
    const layer=LF.tileLayer(`https://{s}.basemap.cartocdn.com/${dark?'dark_all':'voyager'}/{z}/{x}/{y}{r}.png`,{maxZoom:19,subdomains:'abcd',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(mapObj);
    layer.on('tileload',()=>{ok=true});
    LF.marker([loc.lat,loc.lon],{icon:LF.divIcon({className:'',html:'<div class="youpin"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(mapObj);
    const css=getComputedStyle(document.documentElement), col=lv=>css.getPropertyValue(lv==='warning'?'--bad':lv==='watch'?'--warn':'--adv').trim();
    const polys=[];
    S.alerts.filter(a=>a.geom).slice().reverse().forEach(a=>{try{
      const pl=LF.polygon(a.geom.map(poly=>poly.map(ring=>ring.map(([x,y])=>[y,x]))),{color:col(a.level),weight:2,fillOpacity:.14}).addTo(mapObj);
      pl.bindTooltip?.(atxt(a.title)); polys.push(pl);
    }catch(e){}});
    const pin=(lat,lon,lv,hz,title,small)=>LF.marker([lat,lon],{title,icon:LF.divIcon({className:'',html:`<div class="apin ap-${lv}${small?' apin--sm':''}">${ic((HZ[hz]||HZ.other)[0])}</div>`,iconSize:small?[22,22]:[30,30],iconAnchor:small?[11,11]:[15,15]})}).addTo(mapObj);
    if(S.mapScope==='world'){
      const ev=(S.gdacs&&S.gdacs.events)||[];
      ev.slice().sort((a,b)=>LV_RANK[a.level]-LV_RANK[b.level]).forEach(e=>{const m=pin(e.lat,e.lon,LV_CLS[e.level],GD_HZ[e.type],`${gdName(e.type)} ${e.name||''} · ${e.country||''}`,e.alert==='Green');m.on('click',()=>window.open(e.report,'_blank','noopener'))});
      mapObj.setView([20,loc.lon>-30?100:-60],2);
    }else{
      const pts=S.alerts.filter(a=>a.lat!=null&&a.lon!=null);
      pts.forEach(a=>pin(a.lat,a.lon,LV_CLS[a.level],a.hazard,atxt(a.title)));
      // draw GDACS affected areas (cyclone wind zones, flood extents…) for events near you
      S.alerts.filter(a=>a.source==='gdacs'&&a.geomUrl).forEach(a=>fetchGdacsGeom(a).then(fc=>{
        if(!fc||!mapObj) return;
        try{LF.geoJSON(fc,{filter:f=>f.geometry&&/Polygon/.test(f.geometry.type),style:f=>{const c=String((f.properties&&(f.properties.Class||f.properties.class||f.properties.polygonlabel))||'');return {color:col(/red/i.test(c)?'warning':/orange/i.test(c)?'watch':a.level),weight:1.5,fillOpacity:.12}}}).addTo(mapObj)}catch(e){}
      }));
      const shel=(S.shelters&&S.shelters.list||[]).slice(0,8);
      mapPins.shelters=shel.map((s,i)=>{const m=LF.marker([s.lat,s.lon],{title:s.name,icon:LF.divIcon({className:'',html:`<div class="apin ap-shelter">${ic('home')}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(mapObj);m.on('click',()=>focusShelter(i,false));return m});
      const near=pts.filter(a=>!a.dist||a.dist<1500);
      const nearSh=shel.slice(0,3);
      if(near.length||polys.length||nearSh.length){try{const b=LF.latLngBounds([[loc.lat,loc.lon],...near.map(a=>[a.lat,a.lon]),...nearSh.map(s=>[s.lat,s.lon])]);polys.forEach(p=>b.extend(p.getBounds()));mapObj.fitBounds(b.pad(.2),{maxZoom:11})}catch(e){}}
    }
    setTimeout(()=>{if(!ok&&document.getElementById('map')===el){try{mapObj.remove()}catch(e){} mapObj=null; mapFallback(el)}},3500);
  }catch(e){mapFallback(el)}
}

document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-link]');
  if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();if(a.dataset.scope) S.mapScope=a.dataset.scope;if(a.dataset.after) S.afterLogin=a.dataset.after;go(a.getAttribute('href').split('?')[0]);return}
  const b=e.target.closest('[data-action]'); if(!b) return;
  const act=b.dataset.action, v=b.dataset.v;
  if(act==='scrim'&&e.target!==b) return;
  switch(act){
    case 'menu': openMenu(); break;
    case 'close': case 'scrim': closeOverlay(); break;
    case 'lang-toggle': setLang(S.lang==='en'?'ko':'en'); break;
    case 'lang': setLang(v); if(ov().querySelector('.menu')) openMenu(); else if(ov().querySelector('.sheet')) openSettings(); break;
    case 'unit': S.unit=v; S.unitSet=true; store.set('unit',v); openSettings(); render(false); break;
    case 'settings': openSettings(); break;
    case 'locate': closeOverlay(); locate(); break;
    case 'loc-allow': closeOverlay(); locate(); break;
    case 'loc-later': store.set('locAsked',true); closeOverlay(); break;
    case 'days': S.days=S.days===7?14:7; render(false); break;
    case 'gfilter': S.gFilter=v; S.gShown=12; render(false); break;
    case 'gmore': S.gShown+=12; render(false); break;
    case 'dfilter': S.dFilter=v; render(false); break;
    case 'compose': if(!ACC.user){S.afterLogin='/community';go('/login');break} openCompose(); break;
    case 'posts-refresh': PST.list=null; renderPosts(); loadPosts(); break;
    case 'post-del': {
      if(b.dataset.armed!=='1'){b.dataset.armed='1';const old=b.innerHTML;b.innerHTML=`${ic('trash','icon')}${t('confirmDel')}`;setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.innerHTML=old}},4000);break}
      Posts.remove(v).then(()=>{if(b.dataset.r) return Posts.dismiss(b.dataset.r)}).then(()=>{toast(t('postDeleted'));loadPosts()}).catch(err=>toast(errText(err)));break}
    case 'post-approve': Posts.approve(v).then(()=>{toast(t('approved'));loadPosts()}).catch(err=>toast(errText(err))); break;
    case 'post-report': {const p=(PST.list||[]).find(x=>x.id===v); if(!p) break; Posts.report(p).then(()=>{toast(t('reported'));b.disabled=true;b.innerHTML=`${ic('check','icon')}${t('reportedBtn')}`}).catch(err=>toast(errText(err)));break}
    case 'report-dismiss': Posts.dismiss(v).then(()=>{toast(t('dismissed'));loadPosts()}).catch(err=>toast(errText(err))); break;
    case 'speak': speak(); break;
    case 'notify': enableNotify(); break;
    case 'tts-toggle': ttsToggle(); break;
    case 'tts-stop': ttsStop(); break;
    case 'tts-rate': ttsRate(); break;
    case 'tts-text': ttsText(); break;
    case 'doc': openDoc(v); break;
    case 'scope': S.mapScope=v; render(false); break;
    case 'sh-focus': focusShelter(+v,true); break;
    case 'refresh-alerts': S.alertsReady=false; render(false); loadAlerts(); break;
    case 'call': if(b.getAttribute('href')==='#'){e.preventDefault();document.getElementById('f-cphone')?.focus()} break;
    case 'logout': Acc.signOut().then(()=>{toast(t('loggedOut'));go('/')}).catch(err=>toast(errText(err))); break;
    case 'delete':
      if(!S.delArm){S.delArm=true;b.textContent=t('delConfirm');setTimeout(()=>{S.delArm=false;const d=document.getElementById('delbtn');d&&(d.textContent=t('del'))},4000)}
      else{S.delArm=false;Acc.remove().then(()=>{toast(t('deleted'));go('/')}).catch(err=>toast(errText(err)))} break;
    case 'pw-eye': {const inp=b.parentNode.querySelector('input');inp.type=inp.type==='password'?'text':'password';b.innerHTML=ic(inp.type==='password'?'eye':'eyeoff');break}
    case 'forgot': openForgot(); break;
    case 'google': {const er=document.getElementById('g-err');b.classList.add('is-busy');Acc.google().catch(err=>{const m=errText(err);if(er){er.textContent=m;er.hidden=!m}}).finally(()=>b.classList.remove('is-busy'));break}
    case 'emergency': openEmergency(); break;
    case 'copy-loc': copyText(helpText()); break;
    case 'g-remove': {const gs=[...(ACC.profile.guardians||[])];gs.splice(+v,1);Acc.save({guardians:gs}).then(()=>{toast(t('removed'));render(false)}).catch(err=>toast(errText(err)));break}
    case 'c-remove': {const cs=[...(ACC.profile.careFor||[])];cs.splice(+v,1);Acc.save({careFor:cs}).then(()=>{toast(t('removed'));render(false)}).catch(err=>toast(errText(err)));break}
    case 'linked-refresh': ACC.linked=null; render(false); loadLinked(); break;
    case 'verify-resend': Acc.resendVerify().then(()=>toast(t('verifySent'))).catch(err=>toast(errText(err))); break;
    case 'verify-check': Acc.refreshVerify().then(()=>{toast(ACC.user.verified?t('verifiedOk'):t('notYet'));render(false);if(ACC.user.verified&&!isPatient()) loadLinked()}).catch(err=>toast(errText(err))); break;
  }
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, d=Object.fromEntries(new FormData(f).entries());
  const showErr=(id,msg,focus)=>{const el=document.getElementById(id);if(el){el.textContent=msg;el.hidden=!msg} if(focus) focus.focus()};
  const busy=(on)=>{const btn=f.querySelector('[type=submit]');if(btn){btn.disabled=on;btn.classList.toggle('is-busy',on)}};
  const person=px=>({name:(d[px+'name']||'').trim(),relation:(d[px+'rel']||'').trim(),email:(d[px+'email']||'').trim().toLowerCase(),phone:(d[px+'phone']||'').trim()});
  if(f.id==='f-login'){
    if(!EMAIL_RE.test((d.email||'').trim())) return showErr('l-err',t('badEmail'),f.email);
    if(!d.password) return showErr('l-err',t('ePwReq'),f.password);
    showErr('l-err',''); busy(true);
    Acc.signIn(d.email,d.password).then(()=>toast(t('welcome'))).catch(err=>showErr('l-err',errText(err))).finally(()=>busy(false));
  }
  if(f.id==='f-signup'){
    const role=d.role||'patient', ob=!!f.dataset.onboard;
    if(ob) d.email=ACC.user.email;
    if(!(d.name||'').trim()) return showErr('s-err',t('eName'),f.name);
    if(!ob){
      if(!EMAIL_RE.test((d.email||'').trim())) return showErr('s-err',t('badEmail'),f.email);
      if((d.password||'').length<6) return showErr('s-err',t('eWeak'),f.password);
      if(d.password!==d.password2) return showErr('s-err',t('eMatch'),f.password2);
    }
    const other=person(role==='patient'?'g':'p');
    if(other.email&&!EMAIL_RE.test(other.email)) return showErr('s-err',t('badEmail'),f[(role==='patient'?'g':'p')+'email']);
    if(other.email&&other.email===(d.email||'').trim().toLowerCase()) return showErr('s-err',t('eSelf'));
    if(!f.agree.checked) return showErr('s-err',t('eAgree'),f.agree);
    showErr('s-err',''); busy(true);
    const has=other.name||other.email||other.phone;
    const prof={role,name:d.name.trim(),phone:(d.phone||'').trim(),age:d.age||'',gender:d.gender||'',address:(d.address||'').trim()};
    if(role==='patient'){Object.assign(prof,{conditions:(d.conditions||'').trim(),guardians:has?[other]:[],guardianEmails:other.email?[other.email]:[],shareWithGuardians:!!f.share.checked,shareLocation:!!f.share.checked})}
    else Object.assign(prof,{careFor:has?[other]:[]});
    (ob?Acc.finishProfile(prof):Acc.signUp(d.email,d.password,prof)).then(()=>{toast(t('accCreated'));if(ACC.mode==='firebase'){go('/profile')}}).catch(err=>showErr('s-err',errText(err))).finally(()=>busy(false));
  }
  if(f.id==='f-guardian'||f.id==='f-carefor'){
    const px=f.id==='f-guardian'?'ng':'nc', np=person(px);
    if(!np.name&&!np.email&&!np.phone){f[px+'name'].focus();return}
    if(np.email&&!EMAIL_RE.test(np.email)) return showErr('ng-err',t('badEmail'),f[px+'email']);
    if(np.email&&np.email===ACC.user.email) return showErr('ng-err',t('eSelf'));
    const key=f.id==='f-guardian'?'guardians':'careFor';
    busy(true);
    Acc.save({[key]:[...(ACC.profile[key]||[]),np]}).then(()=>{toast(t('added'));render(false)}).catch(err=>toast(errText(err))).finally(()=>busy(false));
  }
  if(f.id==='f-details'){
    busy(true);
    const patch={name:(d.name||'').trim(),phone:(d.phone||'').trim(),age:d.age||'',gender:d.gender||'',address:(d.address||'').trim()};
    if(isPatient()) patch.conditions=(d.conditions||'').trim();
    Acc.save(patch).then(()=>{toast(t('saved'));render(false)}).catch(err=>toast(errText(err))).finally(()=>busy(false));
  }
  if(f.id==='f-reset'){
    if(!EMAIL_RE.test((d.email||'').trim())) return showErr('r-err',t('badEmail'),f.email);
    busy(true);
    Acc.reset(d.email).then(()=>{closeOverlay();toast(t('resetSent'))}).catch(err=>showErr('r-err',errText(err))).finally(()=>busy(false));
  }
  if(f.id==='cform'){
    if(!(d.title||'').trim()){f.title.focus();return}
    if(!ACC.user){closeOverlay();go('/login');return}
    const post={type:POST_TYPES.includes(d.type)?d.type:'cleanup',title:d.title.trim().slice(0,90),loc:(d.loc||'').trim().slice(0,80),details:(d.details||'').trim().slice(0,600)};
    busy(true);
    Posts.create(post).then(st=>{closeOverlay();toast(st==='approved'?t('posted'):t('postSent'));loadPosts()}).catch(err=>{const el=document.getElementById('c-err');if(el){el.textContent=errText(err);el.hidden=false}}).finally(()=>busy(false));
  }
});
window.addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('scrolled',scrollY>4),{passive:true});
function setLang(l){S.lang=l;store.set('lang',l);if(S.gdacs&&S.gdacs.sample) S.gdacs.events=sampleGdacs();if(S.alertsSample) S.alerts=sampleAlerts();if(S.loc){S.place=null;geocode().then(()=>render(false))} render(false)}
function speak(){
  const w=S.wx; if(!w||!('speechSynthesis' in window)) return;
  const tr=tempRisk(w.cur.fl), ab=w.aqi!=null?aqBand(w.aqi):null, U=S.unit==='f'?'Fahrenheit':'Celsius';
  const txt=S.lang==='ko'
    ?`현재 기온 ${deg(w.cur.t)}도, 체감 ${deg(w.cur.fl)}도, ${wxLabel(w.cur.code)}. 최고 ${deg(w.daily[0].max)}도, 최저 ${deg(w.daily[0].min)}도. ${ab?'대기질 '+ab.ko+'.':''} ${tr.act}`
    :`It is ${deg(w.cur.t)} degrees ${U}, feels like ${deg(w.cur.fl)}, ${wxLabel(w.cur.code)}. High ${deg(w.daily[0].max)}, low ${deg(w.daily[0].min)}. ${ab?'Air quality is '+ab.en+'.':''} ${tr.act}`;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=S.lang==='ko'?'ko-KR':'en-US';speechSynthesis.speak(u)}catch(e){}
}

/* ================= boot ================= */
render(false);
loadWeather();
bootLocation();
initAccounts();
})();
</script>
