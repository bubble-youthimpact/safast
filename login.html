<style>
/* Layout: field-instrument app — sticky sidebar on desktop, bottom tab bar on phones; readouts in mono, signal orange reserved for action + alerts */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#10202A; --muted:#566770; --line:#D8DFDC;
  --accent:#FF9F0A; --accent-ink:#FFFFFF; --accent-soft:#FFEFD3; --accent-text:#A85F00;
  --ok:#1C8A4B; --ok-soft:#DCF1E4; --warn:#B87D00; --warn-soft:#FAEFCF; --bad:#CC3329; --bad-soft:#FADCD9;
  --adv:#2860B0; --adv-soft:#E2ECF9; --wx-cloud:#C5D0D6; --wx-rain:#3C8AD6; --cold:#5AA7DC; --warm:#F08A3C;
  --shadow:0 1px 2px rgba(16,32,42,.05),0 10px 30px -18px rgba(16,32,42,.35);
  --f-display:'Familjen Grotesk','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Instrument Sans','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1216; --surface:#131D23; --surface-2:#18242B; --ink:#E5ECEE; --muted:#93A4AB; --line:#24333B;
  --accent:#FFA61F; --accent-ink:#1F1300; --accent-soft:#3A2A0E; --accent-text:#FFBA4D;
  --ok:#4CC37E; --ok-soft:#13301F; --warn:#E5B23C; --warn-soft:#33290F; --bad:#FF6B61; --bad-soft:#3A1715;
  --adv:#7DB2F5; --adv-soft:#15263D; --wx-cloud:#6B7C85; --wx-rain:#5FA8F0; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1216; --surface:#131D23; --surface-2:#18242B; --ink:#E5ECEE; --muted:#93A4AB; --line:#24333B;
  --accent:#FFA61F; --accent-ink:#1F1300; --accent-soft:#3A2A0E; --accent-text:#FFBA4D;
  --ok:#4CC37E; --ok-soft:#13301F; --warn:#E5B23C; --warn-soft:#33290F; --bad:#FF6B61; --bad-soft:#3A1715;
  --adv:#7DB2F5; --adv-soft:#15263D; --wx-cloud:#6B7C85; --wx-rain:#5FA8F0; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
main:focus,main:focus-visible{outline:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:64px}
.topbar__title{display:none!important;font-family:var(--f-display);font-weight:600;font-size:17px}
.spacer{flex:1}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em}
.logo img{width:auto;height:32px;display:block}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);transition:background .15s}
.iconbtn:hover{background:var(--surface-2)}
.langpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 10px;border-radius:999px;background:#FFFFFF;color:#10202A;border:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.04em;box-shadow:0 1px 2px rgba(16,32,42,.06)}
.langpill .icon{width:16px;height:16px}
main{flex:1;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (min-width:600px){.tabbar{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:12px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:390px){.tabbar{padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}.tab{font-size:9.8px;letter-spacing:-.015em}}
.tab__av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:0}
.tab[aria-current="page"] .tab__av{background:var(--accent);color:var(--accent-ink)}
.tab .icon{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"] .icon{stroke-width:2.2}

/* ---------- common blocks ---------- */
.page{display:flex;flex-direction:column;gap:40px;padding-block:20px 8px}
.pagehead{display:flex;flex-direction:column;gap:10px;max-width:640px}
.pagehead h1{font-size:clamp(30px,5.4vw,44px);font-weight:700}
.pagehead p{color:var(--muted);font-size:16.5px;max-width:58ch}
.section{display:flex;flex-direction:column;gap:16px}
.section__head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section__head h2{font-size:22px}
.section__head p{color:var(--muted);margin-top:4px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn--primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn--ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn--ghost:hover{background:var(--surface-2)}
.btn--danger{color:var(--bad);background:transparent}
.btn--sm{height:38px;padding:0 16px;font-size:14px}
.btn .icon{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r-md);border:1px dashed var(--line);color:var(--muted)}
.empty .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.note{font-size:13px;color:var(--muted)}

/* status strip */
.status{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;width:fit-content;max-width:100%}
.status .pulse{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s infinite;flex:none}
.status span{min-width:0}
@media (max-width:520px){.status{border-radius:14px;align-items:flex-start}.status .pulse{margin-top:5px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- home ---------- */
.loc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loc__place{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;min-width:0}
.loc__place .icon{color:var(--accent)}
.loc__place span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toptools{display:flex;gap:8px}.toptools:empty{display:none}
.homegrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.today{padding:24px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.today__top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
.today__when{display:flex;flex-wrap:wrap;gap:2px 10px}
@media (max-width:380px){.avatar{width:52px;height:52px;font-size:20px}.profilehead{gap:12px}}
.today__main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.today__temp{font-family:var(--f-display);font-weight:600;font-size:clamp(76px,16vw,112px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.today__temp sup{font-size:.36em;letter-spacing:0;vertical-align:top;position:relative;top:.18em;margin-left:2px;color:var(--muted)}
.today__wx{width:96px;height:96px}
.today__cond{font-family:var(--f-display);font-size:22px;font-weight:600}
.today__feels{color:var(--muted)}
.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);margin-top:auto}
.readout{padding:14px 0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.readout:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.readout:nth-child(even){padding-left:16px}
.readout:nth-last-child(-n+2){border-bottom:0;padding-bottom:0}
.readout .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout b{white-space:nowrap;font-family:var(--f-mono);font-size:clamp(16px,4.8vw,19px);font-weight:500;font-variant-numeric:tabular-nums}
.sample{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px}

.risk{padding:20px;display:flex;flex-direction:column;gap:14px}
.risk__head{display:flex;align-items:center;gap:12px}
.risk__ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}
.risk__head h3{font-size:17px}
.risk__val{margin-left:auto;text-align:right}
.risk__val b{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.risk__val small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.risk__head h3{min-width:0}
.level{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:4px 10px 4px 8px;border-radius:999px;width:fit-content;max-width:100%;line-height:1.35}
.level::before{flex:none}
.level::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-warn{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}
.lv-info{color:var(--accent-text);background:var(--accent-soft)}
.lv-adv{color:var(--adv);background:var(--adv-soft)}
.risk p{color:var(--muted);font-size:14.5px}
.risk p b{color:var(--ink);font-weight:600}
.scale{position:relative;padding-top:4px}
.scale__bar{display:grid;grid-template-columns:50fr 50fr 50fr 50fr 100fr 200fr;height:8px;border-radius:999px;overflow:hidden;gap:2px}
.scale__bar i{display:block}
.scale__marker{position:absolute;top:-1px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.scale__ticks{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

.forecast{padding:8px 20px 12px}
.frow{display:grid;grid-template-columns:44px 28px minmax(0,1fr) 40px 34px minmax(56px,1.1fr) 34px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.frow:last-of-type{border-bottom:0}
.frow .d{font-weight:600}
.frow .c{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .p{font-family:var(--f-mono);font-size:12.5px;color:var(--wx-rain);text-align:right}
.frow .lo,.frow .hi{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.frow .lo{color:var(--muted)}
.frow svg.w{width:26px;height:26px}
.range{position:relative;height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.range i{position:absolute;top:-1px;bottom:-1px;border-radius:999px;background:linear-gradient(90deg,var(--cold),var(--warm))}
@media (max-width:520px){.frow{grid-template-columns:40px 26px 36px 30px minmax(40px,1fr) 30px}.frow .c{display:none}}
.forecast__more{display:flex;justify-content:center;padding-top:10px}

.contact{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:22px 24px}
.contact h2{font-size:19px}
.contact__links{display:flex;flex-wrap:wrap;gap:8px}
.contact__links a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500}
.contact__links a:hover{border-color:var(--muted)}

/* ---------- education ---------- */
.edu-hero{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.values{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.value{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.value__ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.value__ico svg{width:26px;height:26px}
.value h3{font-size:16px;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.value p{color:var(--muted);font-size:14px}
.steps{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);counter-reset:s}
.step{display:flex;flex-direction:column;gap:6px;padding:18px 0 0;border-top:2px solid var(--ink)}
.step .label{color:var(--accent-text)}
.step h3{font-size:17px}
.step p{color:var(--muted);font-size:14.5px}
.grid-guides{display:grid;gap:20px 16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr))}
.guide{display:flex;flex-direction:column;gap:10px;border-radius:var(--r-md);outline-offset:4px}
.guide:hover .cover{transform:translateY(-3px);box-shadow:0 18px 30px -18px rgba(16,32,42,.5)}
.guide__t{font-weight:600;font-size:15px;line-height:1.35}
.guide__m{font-size:13px;color:var(--muted)}
.cover{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:var(--r-md);overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .2s,box-shadow .2s;isolation:isolate}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.cover__k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.cover__h{font-family:'Familjen Grotesk','Noto Sans KR',sans-serif;font-weight:700;font-size:19px;line-height:1.12;letter-spacing:-.01em;max-width:15ch;text-wrap:balance}
.cover__n{position:absolute;right:12px;bottom:-14px;font-family:'Familjen Grotesk',sans-serif;font-weight:700;font-size:96px;line-height:1;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px #FFA61F;opacity:.9;z-index:-1}
.cover--dyk{background:#0F1C24;color:#E8EFF1}
.cover--dyk .cover__k{color:#FFB13D}
.cover--dyk .cover__h{font-size:16.5px;max-width:17ch;font-weight:600}
.cover--dotw{background:radial-gradient(120% 90% at 85% 0%,#FFD27A 0,transparent 55%),linear-gradient(165deg,#FFA61F,#D96A00);color:#FFF6EF}
.cover--dotw .cover__k{color:#FFE2CF}
.cover--country{background:repeating-radial-gradient(circle at 88% 12%,transparent 0 11px,rgba(15,28,36,.09) 11px 12px),#D6E4E8;color:#0F1C24}
.cover--country .cover__k{color:#2E5A6A}
.cover--country.t-sand{background:repeating-radial-gradient(circle at 90% 85%,transparent 0 11px,rgba(80,50,10,.1) 11px 12px),#EEDDBF}
.cover--country.t-sand .cover__k{color:#7A5212}
.cover--country.t-sky{background:repeating-radial-gradient(circle at 10% 90%,transparent 0 11px,rgba(15,40,80,.09) 11px 12px),#D3DEF4}
.cover--country.t-sky .cover__k{color:#2C4A86}
.cover--mat{background:#F4F1E8;color:#14231C}
.cover--mat.t-green{background:repeating-linear-gradient(0deg,transparent 0 21px,rgba(20,60,40,.1) 21px 22px),#E3EFE6}
.cover--mat.t-green .cover__k{color:#1F6B44}
.cover--mat.t-red{background:linear-gradient(180deg,#D7E3F7 0 34%,#C8322B 34% 82%,#21734A 82%);color:#FFFFFF}
.cover--mat.t-red .cover__k{color:#1C3F7A}

  const sun=`<circle cx="12" cy="12" r="4.6" fill="#F5A524"/><g stroke="#F5A524" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.2v2.1M12 19.7v2.1M2.2 12h2.1M19.7 12h2.1M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></g>`;
  const cloud=(x=0,y=0)=>`<path transform="translate(${x} ${y})" d="M7 19h10a4 4 0 0 0 .6-8A5.5 5.5 0 0 0 7 11.5 3.75 3.75 0 0 0 7 19z" fill="var(--wx-cloud)"/>`;
  let b;
  const g=wxGroup(code);
  if(g==='clear') b=sun;
  else if(g==='partly') b=`<g transform="translate(-2.6 -3.4) scale(.82)">${sun}</g>${cloud(2,1.6)}`;
  else if(g==='cloudy') b=`${cloud(-1.5,-3)}${cloud(1.5,1)}`;
  else if(g==='fog') b=`${cloud(0,-4)}<g stroke="var(--wx-cloud)" stroke-width="1.8" stroke-linecap="round"><path d="M4 18.5h16M6 21.5h12"/></g>`;
  else if(g==='rain') b=`${cloud(0,-4)}<g stroke="var(--wx-rain)" stroke-width="1.9" stroke-linecap="round"><path d="M8 17.5l-1 3M12 17.5l-1 3M16 17.5l-1 3"/></g>`;
  else if(g==='snow') b=`${cloud(0,-4)}<g fill="var(--wx-rain)"><circle cx="8" cy="19" r="1.2"/><circle cx="12" cy="21" r="1.2"/><circle cx="16" cy="19" r="1.2"/></g>`;
  else b=`${cloud(0,-4)}<path d="M12.5 15.5 10 19.5h3l-1.5 3.5" fill="none" stroke="#F5A524" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
}
function wxGroup(c){
  if(c===0||c===1) return 'clear'; if(c===2) return 'partly'; if(c===3) return 'cloudy';
  if(c===45||c===48) return 'fog'; if((c>=51&&c<=67)||(c>=80&&c<=82)) return 'rain';
  if((c>=71&&c<=77)||c===85||c===86) return 'snow'; return 'storm';
}

  {"slug": "did-you-know-series-part-14", "title": "Did You Know Series, Part 14", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776410111551x452889558147282940/Screenshot%202026-04-17%20at%204.08.54%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1C0FemNTiaXf7_-sylCuxBDMPDR2etr8K/view?usp=sharing", "file": "", "script": "", "n": 14},
  {"slug": "did-you-know-series-part-13", "title": "Did You Know Series, Part 13", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776410091135x984207242833076900/Screenshot%202026-04-17%20at%204.08.48%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1f52Q2QRtOtCBCK2y9dvgJp3ddL2W6FB-/view?usp=sharing", "file": "", "script": "Did you know heat lightning doesn't actually exist? Heat lightning isn't a special type of lightning caused by hot weather, as it's just a regular storm playing a trick on your eyes and ears. What we call heat lightning is actually the light from a distant thunderstorm that's too far away for the thunder to be heard. Light travels much farther than sound, so you can see flashes from a storm up to 100 miles away, while thunder usually dissipates after only 10 to 15 miles. This happens because Earth's curvature and the way sound waves interact with different layers of air temperatures cause the thunder to bounce upward or get absorbed before it reaches you, leaving only the silent flicker of light on the horizon.", "n": 13},
  {"slug": "did-you-know-series-part-12", "title": "Did You Know Series, Part 12", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776410070342x819100132760480400/Screenshot%202026-04-17%20at%203.45.35%E2%80%AFPM%20%281%29.webp", "url": "https://drive.google.com/file/d/1EpElz5fXXyfHdxQCz5aRK6r2IJgREDlp/view?usp=sharing", "file": "", "script": "Did you know earthquakes can shorten the length of a day? Massive earthquakes can actually change the length of a day on Earth, making our planet spin slightly faster. For example, the 2011 magnitude 9.1 Japan earthquake shortened our day by about 1.8 microseconds, and the 2004 Sumatra earthquake shortened it by about 6.8 microseconds. This happens due to the ice skater effect, which is the conservation of angular momentum. When an earthquake shifts heavy tectonic plates closer to Earth's center, the planet's mass concentrates inward, causing it to spin faster, just like a spinning skater pulling in their arms.", "n": 12},
  {"slug": "did-you-know-series-part-11", "title": "Did You Know Series, Part 11", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776410043482x600868253362844900/Screenshot%202026-04-17%20at%204.08.42%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1qKE84lw_QZwKRFOlBKBurK7HY9arqdN-/view?usp=sharing", "file": "", "script": "Did you know droughts kill more people than floods—in slow motion? Droughts are considered creeping disasters because they kill more people globally than floods or hurricanes, but they happen in slow motion. Unlike a sudden earthquake, a drought can last for decades. Scientists have identified mega-droughts in history that lasted over 20 to 40 years, reshaping entire civilizations. Droughts are often caused by shifts in ocean temperatures, like La Niña patterns, which alter the jet stream—the high-altitude wind currents that carry moisture. When the jet stream shifts, a high-pressure system can lock over a region for years, acting like a lid that blocks rain clouds.", "n": 11},
  {"slug": "did-you-know-series-part-10", "title": "Did You Know Series, Part 10", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776410019704x559264057740171700/Screenshot%202026-04-17%20at%204.08.32%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1dLF3_v-dvnsxpa_UE0-HrEiQjV5Sc9DL/view?usp=sharing", "file": "", "script": "Did you know volcanoes can launch rivers of concrete at 100 mph? A volcano doesn't need to erupt lava to be deadly, as it can trigger massive concrete rivers called lahars that move at up to 100 mph. A lahar is a volcanic mudflow with the consistency of wet cement. They are much denser than water and can carry boulders the size of houses, and in 1985, a lahar from Nevado del Ruiz in Colombia buried an entire town miles from the peak. Lahars are triggered when volcanic heat, even without a full eruption, rapidly melts glaciers or snowcaps on a volcano's summit. This massive amount of water mixes with loose volcanic ash and rock on the slopes, forming a fast-moving slurry.", "n": 10},
  {"slug": "did-you-know-series-part-9", "title": "Did You Know Series, Part 9", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409994300x782453114357515100/Screenshot%202026-04-17%20at%204.08.31%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1QJs6J-KlVxsuD90NIF3gE8YlixrO0YuX/view?usp=sharing", "file": "", "script": "Did you know tornadoes produce sounds that humans can't even hear? Tornadoes are famous for sounding like a freight train, but they can actually produce sounds that humans can't even hear. While the audible roar is caused by debris and wind, tornadoes also emit infrasound—sound waves with frequencies below 20 hertz, which is lower than the limit of human hearing. Infrasound is generated by the core of the tornado. As the vortex oscillates and pressure within the funnel drops rapidly, it creates a powerful acoustic vibration. These long-wavelength sounds can travel hundreds of miles without losing energy, unlike the higher-pitched sounds we hear.", "n": 9},
  {"slug": "did-you-know-series-part-8", "title": "Did You Know Series, Part 8", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409973146x233958406330817300/Screenshot%202026-04-17%20at%204.08.25%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1PfbzufxTTggA1oKazanIwDaWVZp5uWok/view?usp=sharing", "file": "", "script": "Did you know most of Earth's volcanic eruptions happen underwater? The vast majority of Earth's volcanic eruptions, roughly 70 to 80 percent, happen deep underwater where no one can see them. There are estimated to be over one million volcanoes on the ocean floor. They are so deep that the immense weight of the ocean prevents them from exploding, meaning they go largely undetected by satellite or sonar. Most of these volcanoes sit along mid-ocean ridges, where tectonic plates are pulling apart. As the plates separate, magma rises to fill the gap, creating new seafloor because the crust is thinnest at these boundaries, providing the path of least resistance for magma to escape.", "n": 8},
  {"slug": "did-you-know-series-part-7", "title": "Did You Know Series, Part 7", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409942474x832622182599408900/Screenshot%202026-04-17%20at%204.08.18%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1Zriry8BzRPf_j7DG5hPS8b4ZfDxx5mzU/view?usp=sharing", "file": "", "script": "Did you know giant jellyfish of light float above thunderstorms? Massive, jellyfish-shaped bursts of red light occur above thunderstorms, stretching toward the edge of space, and for decades, pilots who reported them were not believed. Known as red sprites, these electrical discharges can be up to 50 kilometers, or 31 miles, wide. They last only a few milliseconds, far too fast for the naked eye, which is why they were considered a myth for so long. Sprites are triggered by intense lightning strikes between clouds and the ground. An electrical imbalance creates a secondary discharge that reacts with atmospheric nitrogen, giving it a vivid red glow high above the storm.", "n": 7},
  {"slug": "did-you-know-series-part-6", "title": "Did You Know Series, Part 6", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409893365x668315301297705900/Screenshot%202026-04-17%20at%204.08.08%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1aji1xrspvbM6nBGZTB0K-l-T7ZWuu_M2/view?usp=sharing", "file": "", "script": "Did you know wildfires climb hills far faster than flat ground? A wildfire can travel uphill much faster than it travels across flat ground or downhill, turning gentle slopes into death traps in seconds. Fire speed can double for every 10-degree increase in slope, meaning a steady blaze on flat land can explode to life-threatening speeds the moment it hits a chimney-like canyon or steep mountainside. This happens through a process called pre-heating. Because heat and smoke rise vertically, flames on a slope are physically closer to the fuel above, so upward-moving heat dries and ignites vegetation higher up before the fire even makes direct contact.", "n": 6},
  {"slug": "did-you-know-series-part-5", "title": "Did You Know Series, Part 5", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409521494x281397876748876700/Screenshot%202026-04-17%20at%203.44.56%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1WI9Gv6fZuHu8wkUhRZVbL5UzZGi3lNGl/view?usp=sharing", "file": "", "script": "Did you know lightning is five times hotter than the sun's surface? A single bolt of lightning is significantly hotter than the surface of the sun, despite being a flash we see from the ground. The sun's surface sits at roughly 5,500°C, or 9,932°F, but a lightning strike can reach approximately 30,000°C, or 54,000°F—about five times hotter. The immense heat comes from resistance. As the electrical discharge forces through air, a poor conductor, friction and rapidly moving electrons generate an extreme burst of thermal energy in a fraction of a second.", "n": 5},
  {"slug": "did-you-know-series-part-4", "title": "Did You Know Series, Part 4", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409502057x697639843554374900/Screenshot%202026-04-17%20at%203.44.50%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1jgWUZOBgCI4wGP9AWlZhiGlkHBh4SzyA/view?usp=sharing", "file": "", "script": "Did you know the ocean drains away before a tsunami hits? Before a tsunami reaches shore, the ocean often appears to drain away, leaving fish and coral reefs completely stranded and exposed on the sea floor. This phenomenon is called a drawback. The water can recede for hundreds of meters, and it typically happens just 5 to 10 minutes before the massive wave arrives. A tsunami is a series of waves with massive wavelengths. When the trough, the wave's low point, reaches shallow coastline before its crest, it acts like a giant vacuum, pulling coastal water outward toward the wave's center of mass.", "n": 4},
  {"slug": "did-you-know-series-part-3", "title": "Did You Know Series, Part 3", "cat": "\"Did You Know?\" Series", "thumb": "https://60df7181a581897c5f731aa1b27d2a1b.cdn.bubble.io/f1776409388351x496409262390489860/Screenshot%202026-04-17%20at%203.42.02%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/10hWT7KtarG5yrBlYnBK6efvUnL675zL0/view?usp=sharing", "file": "", "script": "Did you know earthquakes can make solid ground flow like liquid? During an earthquake, solid ground can suddenly behave like a liquid, causing entire buildings to sink or tip over perfectly intact. This process is called soil liquefaction. It turns seemingly stable soil into a substance with the consistency of quicksand, and it can also cause underground pipes or storage tanks to float up to the surface while heavy structures sink. Liquefaction occurs in loose, water-saturated soils like sand or silt. Normally, soil particles are in contact with each other, creating friction that supports weight. When seismic waves hit, they increase water pressure between particles, pushing them apart and destroying the soil's strength.", "n": 3},
  {"slug": "did-you-know-series-part-2", "title": "Did You Know Series, Part 2", "cat": "\"Did You Know?\" Series", "thumb": "https://8b30c86b6245a80c63bf15c570321646.cdn.bubble.io/f1774403248083x369332755648434700/Screenshot%202026-03-25%20at%2010.47.00%E2%80%AFAM.webp", "url": "https://drive.google.com/file/d/1eYJUMlfvy0n3pXKo-rq6KG4wkhUZNDTF/view?usp=sharing", "file": "", "script": "Stay safe, stay prepared, stay resilient. Warm air holds more moisture. For every 1 degree Celsius of warming, the atmosphere can hold about 7 percent more water vapor, leading to downpours like the 12-inch event in 2006. In addition, sea levels along the Northeast are rising faster than the global average, turning regular high tides into sunny day flooding in coastal towns. While winters are getting shorter, individual storm events can be more intense because there is more moisture available in warmer air. Knowing the difference between weather alerts is critical for a timely response. A watch means the ingredients for a disaster are present, so stay alert. A warning means the disaster is happening or imminent, so take action now. Unlike riverine flooding that rises slowly over days, flash floods can occur within minutes of heavy rain, especially in hilly terrain or paved urban areas. Also, keep an eye on river levels when a deep freeze is followed by a sudden thaw, as ice chunks acting like a dam can cause water to rise several feet in minutes. Taking the right precautions during and after severe weather saves lives. Most flood-related deaths occur in vehicles, so turn around, don't drown; as little as 6 inches of moving water can knock you off your feet, and 12 inches can sweep away most cars. During high-wind events, the safest place is the lowest level of your home, away from windows and exterior walls. Finally, remember that most injuries happen after the storm, so watch for downed power lines, unstable trees, and invisible mold in flooded basements in high-risk areas like Exeter.", "n": 2},
  {"slug": "did-you-know-series-part-1", "title": "Did You Know Series, Part 1", "cat": "\"Did You Know?\" Series", "thumb": "https://8b30c86b6245a80c63bf15c570321646.cdn.bubble.io/f1774403187749x915408073524535800/Screenshot%202026-03-25%20at%2010.45.10%E2%80%AFAM.webp", "url": "https://drive.google.com/file/d/1Aa7MEu04IkoGtkR54SHYfUleF1Q9iu6N/view?usp=sharing", "file": "", "script": "The Granite State's Greatest Risk: Understanding Environmental Hazards. Stay safe, stay prepared, stay resilient. Riverine flooding is the most common natural disaster in New Hampshire. In May 2006, the Mother's Day event brought over 12 inches of rain in just 72 hours across central and southern New Hampshire, causing millions in damage to roads and bridges. Local insights show that Exeter carries a severe risk score specifically from 500-year flood events. Winter weather and coastal dynamics present severe ongoing challenges across the state. Between 1980 and 2024, New Hampshire experienced 11 separate winter storm events that each caused over 1 billion dollars in losses across affected regions. In the spring, ice jams can block a river's flow and cause sudden flash floods upstream or downstream, and the coastal flood of February 1978 remains one of the most severe on record for the New Hampshire coast. Extreme wind and hurricane events have also shaped the state's environmental history. On April 12, 1934, Mount Washington recorded a ground wind speed of 231 miles per hour, one of the highest ever measured in the world. The 1938 Long Island Express hit New Hampshire, causing 13 deaths and massive flooding in river basins, while modern threats like Hurricanes Irene in 2011 and Sandy in 2012 caused severe erosion, destroyed culverts across the state, and brought widespread flooding and damage. Staying safe in Exeter is critical, as flooding is the most significant environmental threat there, carrying a severe risk score of 73 out of 100. Experts recommend being self-sufficient for at least 72 hours or 3 days after a disaster because emergency services will be busy, and a basic emergency kit should include 1 gallon of water per person per day, non-perishable food, and a battery-powered radio.", "n": 1},

  {"slug": "72-hour-emergency-kit", "title": "72-Hour Emergency Kit", "cat": "Preparedness Guidelines", "thumb": "https://f3588384dae1193aefd261e3edd79de4.cdn.bubble.io/f1772523021920x246730865825768960/Screenshot%202026-03-03%20at%204.29.53%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1B2rAXGTltHndKiaN39dqf-e_Aif161Jf/view?usp=sharing", "file": "", "script": ""},
  {"slug": "air-quality-guidelines", "title": "Air Quality Guidelines", "cat": "Weather Hazards", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011189767x896942695768696300/Screenshot%202025-11-13%20at%202.06.09%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1GUCbYRVZLZP5qYWh6n251h8bmJw1gZFS/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009227066x535969518664659400/Air%20Quality%20Guidelines.pdf", "script": "Protect Yourself From Poor Air Quality. Air pollution can irritate your eyes and lungs and lead to more serious conditions like asthma, bronchitis, and heart attack. Wear a mask if outside. N95 or KN95 masks work best. Avoid strenuous activity. Choose easier-to-breathe activities like walking. Keep indoor air clean. Run fan, AC, and filter to circulate. Who’s most at risk: Seniors. Children. People with lung or heart conditions. Outdoor workers. Recognizing symptoms: Cough, wheezing. Burning throat. Chest tightness. Seek help for urgent symptoms: Trouble breathing. Confusion."},
  {"slug": "air-quality-magazine", "title": "Air Quality Magazine", "cat": "Educational Materials", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011480295x445307766645143040/Screenshot%202025-11-13%20at%202.06.17%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1GfpYpSbcYo2H29tzf6GB08smr59abKsM/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009236694x444837849369447360/Air%20Quality%20Magazine.pdf", "script": "Air quality. Measuring and Managing Pollution. Examining Environmental Hazards. Why Air Quality Matters. Polluted air can cause or worsen respiratory diseases such as asthma, bronchitis, and chronic obstructive pulmonary disease. Yet, air pollution remains one of the leading environmental hazards worldwide, contributing to millions of premature deaths each year. Poor air quality damages ecosystems. Acid rain, formed from sulfur and nitrogen emissions, harms lakes, forests, and soil. Air quality is tightly connected to climate change. Many pollutants, like black carbon and methane, also contribute to global warming. Who’s Most at Risk. Air pollution does not affect everyone equally. Certain groups are more vulnerable to the harmful effects of poor air quality. Children breathe more rapidly and take in more air per pound of body weight than adults. Their lungs and immune system are still developing. Older adults are more likely to have conditions such as heart or lung disease, or diabetes. People with asthma, chronic bronchitis, COPD, or cardiovascular problems are more vulnerable. Exposure to air pollution during pregnancy is linked to low birth weight, premature birth, and developmental issues. Warning Signs and Monitoring. The Air Quality Index, or AQI, is a scale used to communicate how polluted the air is and its associated health risks. Knowing signs of poor air quality can help people respond quickly. Common warning signs include smog, strong industrial or chemical odors, reduced visibility, and respiratory irritation such as burning eyes, coughing, or shortness of breath during outdoor activity. Weather apps, government websites, and local news often provide real-time AQI updates. In some areas, text or push alerts notify residents when air quality reaches dangerous levels."},
  {"slug": "emergency-guidelines-for-children", "title": "Emergency Guidelines for Children", "cat": "Vulnerable Populations", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011501479x624408707024656300/Screenshot%202025-11-13%20at%202.06.23%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1APHLvCBPQKaAE8yj-bmzlRgpZP89Wer3/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009245687x517471004048973200/Emergency%20Guidelines%20for%20Children.pdf", "script": "Children in emergencies. A Guide to Keeping Kids Safe. How to prepare, protect, and care for your children during natural disasters. Keeping Children Calm During Emergencies. Kids often copy how adults react. If you stay calm, they’ll feel safe and confident. Speak softly and clearly. Explain what’s happening in simple words. Keep them close and reassure them. Offer comfort items like a toy or blanket. Remember: Your calm presence is their greatest comfort. After the emergency, talk about what happened using gentle language. Let kids draw or play to express feelings. Praise their bravery and cooperation. Keeping Children Strong During Emergencies. Emergencies can be scary, but your calm presence helps kids stay strong. Let kids know it’s okay to feel scared. Stay calm and reassuring. Praise their bravery. Remind them that helpers are always around. Together, you can turn fear into courage. After the Emergency. After a disaster, kids might still feel anxious or sad, even if they’re safe. Help them talk through their feelings to feel better and stronger. Be patient. Listen and comfort. Seek help if needed. Your pediatrician can recommend a specialist. Reassure your child: Healing has its own timetable. Be Ready, Stay Safe. Prepared families stay protected. Keep your family plan somewhere easy to find. Update emergency kits twice a year. Practice drills together. Make it fun. Being prepared keeps your family strong. Safety starts with calm, caring, and connection."},
  {"slug": "emergency-guidelines-for-people-with-disabilities", "title": "Emergency Guidelines for People with Disabilities", "cat": "Vulnerable Populations", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011522988x896152844336148400/Screenshot%202025-11-13%20at%202.06.30%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1AvXkbm8gXlJxPefNXtJyA4leC3V6xsnY/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009255673x513526627724291600/Emergency%20Guidelines%20for%20People%20with%20Disabilities.pdf", "script": "Prepared and protected. A Guide for People with Disabilities in Natural Disasters. Simple steps to stay safe before, during, and after emergencies. Why Preparedness Matters. Disasters impact everyone differently. One in four adults live with a disability, which can create additional challenges during floods, fires, hurricanes, earthquakes, and more. Keeping yourself safe helps reduce stress, protects your health and independence, and even saves lives. You are your best advocate. Getting Ready. Plan ahead with an emergency kit. Know your local emergency services. Have an evacuation plan. Practice evacuation routes. During a Natural Disaster. Stay calm and inside. Follow your emergency plan. Use your emergency kit. Stay informed. Assistance During Emergencies. Share your disabilities with first responders. Tell them how they can assist you. Bring any essential equipment, if possible. Make notes for yourself and/or them. Plan Ahead. Create an emergency plan. Know the evacuation routes. Assemble a go kit."},
  {"slug": "emergency-guidelines-for-pets", "title": "Emergency Guidelines for Pets", "cat": "Vulnerable Populations", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011544595x882309106237511300/Screenshot%202025-11-13%20at%202.09.10%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1_smSf3L2B4NCFXD7dIL_W0hKyACxehCb/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009265133x499044040461537300/Emergency%20Guidelines%20for%20Pets.pdf", "script": "Pets in emergencies. A Guide to Keeping Your Animals Safe. How to prepare, protect, and care for your pets during natural disasters. Why Pet Preparedness Matters. Disasters like floods, wildfires, heatwaves, and hurricanes can threaten pets too. Every year, many pets are lost or rescued during natural disasters. Make a plan now. It could save your pet’s life. Before the Disaster. Prepare a pet emergency plan. Make sure ID tags and microchips are up to date. Prepare an emergency kit with food, water, medicine, leash, carrier, and other essentials. Have an evacuation plan, including pet-friendly shelters or hotels. Keep copies of vet records and photos of pets. Tip: Practice loading your pet into a carrier. Don’t wait until it’s an emergency. During the Disaster. Stay calm and keep pets secure. If you must evacuate or shelter in place, keep pets leashed or in carriers at all times. Don’t leave them behind. Explain dangers such as heat, flooding, toxic debris, and other hazards. For a fire, cover the crate with a towel to keep pets calm. For a flood, move pets to high ground. For a storm, create a safe room. After the Disaster. Check pets for injuries or stress. Watch for changes in behavior, such as fear, aggression, or hiding. Contact local shelters if you are separated from your pets. Avoid contaminated water or debris. Tip: Reintroduce pets slowly to home. Familiar smells help reduce anxiety. Resources and Quick Reference. Emergency contacts include local animal shelters, ASPCA, and FEMA pet resources. Your pets depend on you. Prepare today so they can stay safe tomorrow."},
  {"slug": "extreme-heat-guidelines", "title": "Extreme Heat Guidelines", "cat": "Weather Hazards", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011772154x363891282433849150/Screenshot%202025-11-13%20at%202.09.15%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1-bGHqYZbX7PvLDv5J2xpa4ieI9b44Ilk/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009271242x978992561040798300/Extreme%20Heat%20Guidelines.pdf", "script": "Stay Safe in Extreme Heat. Extreme heat can lead to dehydration, heat exhaustion, and heat stroke. Who’s most at risk: Seniors. Children. People with chronic illnesses. Outdoor workers. Symptoms: Headache. Dizziness. Muscle cramps. Confusion. Nausea. Preventive actions: Keep cool. Stay hydrated. Plan your day. Emergency steps: Call 911. Drink. Apply cool clothes."},
  {"slug": "flood-risk-magazine", "title": "Flood Risk Magazine", "cat": "Educational Materials", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011792994x416120753962490100/Screenshot%202025-11-13%20at%202.09.23%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1XMmq0fgpoKzJ0mIZeH542HejHFDHDwW2/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009278400x452557013861533400/Flood%20Risk%20Magazine.pdf", "script": "Rising waters. Understanding Flood Risk. Stay safe, stay prepared, stay resilient. Why Floods Are Dangerous. Floods are the most common and costly natural disaster in the U.S. They can cause injury, property damage, and disrupt utilities. Climate change is increasing the frequency and severity of flooding. More floods result in higher costs and longer recoveries. Who’s Most at Risk. Anybody can be impacted by floodwaters, but some groups are especially vulnerable due to physical, economic, or environmental factors. Seniors, people with limited mobility, low-income households, and residents in flood-prone areas are especially at risk. Warning Signs and Alerts. Early warnings save lives. A flood watch means conditions are favorable. Be ready to move to high ground. A flood warning means flooding is happening or imminent. Take action immediately. Streams or drainage ditches filling fast, water covering roads, or sudden changes in water color or speed all signal danger. Sign up for SAFAST and NOAA Weather Radio. Listen for sirens, community loudspeakers, or instructions from officials. Prevention and Home Protection. While you can’t stop the rain, you can reduce flood damage and keep your household safer. Elevate utilities. Move furnaces, water heaters, and electrical panels above potential flood levels. Seal cracks. Use waterproof sealant on basement walls and foundations. Install backflow valves to prevent sewage backup. Check FEMA or local flood-zone maps. Review your homeowner’s or renter’s insurance. Standard policies usually don’t cover flood damage. Keep important documents in a waterproof container. Prepare an emergency kit with three days of water, food, and medications. Identify evacuation routes and practice with family members. What To Do During a Flood. When water starts rising, every minute counts. Evacuate if told to by local officials. Move to higher ground. Never stay in a flooded basement. Take medications, identification, and essentials. Unplug appliances if there’s time. Never walk or drive through water. Six inches of moving water can knock you down; one foot can sweep a car away. Watch for hidden debris, downed power lines, and contamination. Use a battery-powered radio or phone for updates. Text, don’t call, when possible to keep networks open."},
  {"slug": "heat-risk-magazine", "title": "Heat Risk Magazine", "cat": "Educational Materials", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011810691x900280715508312600/Screenshot%202025-11-13%20at%202.09.33%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1plEqb-i7E5IsRAgAul4YO6cgObrKbnf9/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009287195x591679001900386800/Heat%20Risk%20Magazine.pdf", "script": ""},
  {"slug": "mosquito-bites-guidelines", "title": "Mosquito Bites Guidelines", "cat": "Weather Hazards", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011828139x510102535461728300/Screenshot%202025-11-13%20at%202.09.41%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1wMLD06cmVnHvMx61VPiJreNG643pfzXz/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009292964x699275227466261200/Mosquito%20Bites%20Guidelines.pdf", "script": "Protect Yourself from Mosquito Bites. Mosquitoes can carry diseases like West Nile virus, Zika, and dengue. Protecting yourself helps keep you and your community safe. Who’s most at risk: Seniors. Children. People with chronic illnesses. Outdoor workers. Bite symptoms: Fever. Headache. Rash. Joint pain. If you experience one or more, seek medical help immediately. Prevention tips: Use insect repellent. Wear protective clothing. Avoid peak hours."},
  {"slug": "protection-against-floods-guidelines", "title": "Protection Against Floods Guidelines", "cat": "Weather Hazards", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011844463x741085321350419200/Screenshot%202025-11-13%20at%202.09.46%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1eKGlk7AP5zYJ4bxYaGsVzWwVftcZ90AM/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009299092x334187363653465600/Protection%20Against%20Floods%20Guidelines.pdf", "script": "Stay Safe During Floods. Before a flood: Know your risk. Check if your area is in a flood zone. Prepare an emergency kit. Water, food, flashlight, medications, documents. Sign up for alerts. SAFAST, weather apps, local emergency notifications. During a flood: Avoid floodwaters. Do not walk or swim near flooded areas. Move to higher ground. Go upstairs or a safer location. Follow local authorities. Evacuate when told. After a flood: Avoid flooded areas. Water may be contaminated or contain hidden dangers. Avoid downed power lines. Report them immediately."},
  {"slug": "psychological-coping-guidelines", "title": "Psychological Coping Guidelines", "cat": "Mental Health", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011861610x121001387527430060/Screenshot%202025-11-13%20at%202.09.56%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/1lpZ-hEInKCSC_ME5H4aLTAVOw2_IYAtG/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009308769x115391044313484020/Psychological%20Coping%20Guidelines.pdf", "script": "Coping with Disasters and Building Resilience: Stay safe, stay prepared, stay resilient. Disasters—whether natural, technological, or human-made—can disrupt lives in sudden, overwhelming ways. Beyond physical damage, they deeply affect emotional well-being. Feelings of anxiety, confusion, anger, difficulty concentrating, or trouble sleeping are completely natural stress reactions to abnormal events. To manage these immediate stress reactions, small actions can help: practice deep breathing by taking slow, deliberate breaths to calm your body and mind, maintain daily routines with consistent schedules for eating, resting, and sleeping, limit news stress by taking needed breaks from media while relying only on verified, official sources, and engage in relaxing activities by focusing on small, manageable tasks to regain a sense of control. Taking step-by-step measures also builds long-term resilience and ongoing emotional recovery: prioritize physical health by drinking water, staying active, and giving yourself time to recover; reconnect with others by talking openly with friends, family, and neighbors, or participating in local community recovery efforts; and support and heal, as helping others when you are able promotes shared healing and progress. Finally, know when to get help and reach out whenever you need additional guidance or care. If you experience ongoing sadness, overwhelming anxiety, or continued trouble functioning, reach out for assistance by connecting with healthcare professionals, counselor networks, or specialized trauma resources. You do not have to go through this alone—support is available, so reach out whenever you need it."},
  {"slug": "safast-brochure", "title": "SAFAST Brochure", "cat": "Educational Materials", "thumb": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763011876327x611650000625676700/Screenshot%202025-11-13%20at%202.10.03%E2%80%AFPM.webp", "url": "https://drive.google.com/file/d/11sUx9UuHlF0LnmNW9uwdflqZUBeY2HlX/view?usp=sharing", "file": "https://a078a6a57e481fae78552e99024416da.cdn.bubble.io/f1763009315492x202139366525178500/SAFAST%20Brochure.pdf", "script": ""}

  {slug:'hurricane-helene',year:'2024',type:'storm',title:{en:'Hurricane Helene',ko:'허리케인 헐린'},region:'Southeastern United States',
   text:'Hurricane Helene stands out because of the catastrophic inland destruction it caused, far from where it made landfall. While coastal areas faced predictable storm surges, the real danger manifested as extreme rainfall in the Appalachian Mountains. This led to "pre-saturated" soil failing, causing massive mudslides and flash floods that wiped out entire mountain towns. It serves as a reminder that a hurricane’s most lethal threat isn\'t always the wind at the coast, but the rain that follows it hundreds of miles inland.',
   lesson:'Inland communities need flood plans for hurricanes, not only coastal ones.'},
  {slug:'typhoon-yagi',year:'2024',type:'storm',title:{en:'Typhoon Yagi',ko:'태풍 야기'},region:'Vietnam, Thailand, China',
   text:'Typhoon Yagi was one of the most powerful storms to hit the South China Sea in decades, impacting Vietnam, Thailand, and China. What made Yagi particularly dangerous was its rapid intensification phase, where it jumped several categories in strength in a very short window. This left local authorities and residents with very little time to execute evacuation plans. The storm triggered severe landslides and long-term power outages, highlighting how warming oceans are creating storms that evolve faster than human warning systems.',
   lesson:'Rapid intensification shrinks warning time. Prepare before the forecast looks severe.'},
  {slug:'hurricane-otis',year:'2023',type:'storm',title:{en:'Hurricane Otis',ko:'허리케인 오티스'},region:'Acapulco, Mexico',
   text:'Hurricane Otis is a landmark event in meteorology because it transformed from a mild tropical storm to a Category 5 hurricane in less than 24 hours before hitting Acapulco, Mexico. This nightmare scenario meant that a city of nearly a million people went to sleep expecting a rainy night and woke up to a catastrophic disaster. The lack of lead time for preparation led to massive structural failures and a high casualty count, emphasizing the increasingly unpredictable nature of modern, climate-driven storms.',

function sampleWx(){

  return {sample:true,tz:'Asia/Seoul',time:new Date().toISOString(),
    cur:{t:13,fl:13,rh:61,code:2,wind:9},aqi:82,

}
async function getJSON(url,ms=7000,headers){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal,headers}); if(!r.ok) throw new Error(r.status); return await r.json()}finally{clearTimeout(tm)}
}
async function loadWeather(){
  const loc=S.loc||DEFAULT_LOC;
  try{
    const f=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=precipitation,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,apparent_temperature_max,snowfall_sum&timezone=auto&forecast_days=14`);
    let aqi=null;
    try{const a=await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&current=us_aqi`);aqi=a.current&&a.current.us_aqi}catch(e){}
    S.wx={sample:false,tz:f.timezone,time:f.current.time,
      cur:{t:f.current.temperature_2m,fl:f.current.apparent_temperature,rh:f.current.relative_humidity_2m,code:f.current.weather_code,wind:f.current.wind_speed_10m},aqi,
      daily:f.daily.time.map((d,i)=>({d,code:f.daily.weather_code[i],max:f.daily.temperature_2m_max[i],min:f.daily.temperature_2m_min[i],p:f.daily.precipitation_probability_max[i],flMax:f.daily.apparent_temperature_max[i],snow:f.daily.snowfall_sum[i]})),
      hourly:{time:f.hourly.time,rain:f.hourly.precipitation,gust:f.hourly.wind_gusts_10m}};
  }catch(e){ S.wx=sampleWx(); }
  await geocode();
  if(cur().name==='home') render(false);
  loadAlerts();
}
async function geocode(){
  if(!S.loc){S.place=defName();S.country=DEFAULT_LOC.country;applyUnits();return}
  if(S.place&&S.country) return;
  const bdc=lang=>`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${S.loc.lat}&longitude=${S.loc.lon}&localityLanguage=${lang}`;
  try{
    const g=await getJSON(bdc(S.lang));
    S.country=g.countryCode||null; store.set('country',S.country);
    const sub=g.countryCode==='US'?(g.principalSubdivisionCode||'').replace('US-',''):g.principalSubdivision;
    S.place=[g.locality||g.city,sub].filter(Boolean).join(', ')||null;
  }catch(e){ if(!S.place) S.place=`${S.loc.lat.toFixed(2)}, ${S.loc.lon.toFixed(2)}` }
  applyUnits();
}
function applyUnits(){ if(!S.unitSet) S.unit=(S.country||'US')==='US'?'f':'c' }
let locBusy=false;
function locate(silent){
  if(!navigator.geolocation){ if(!silent) toast(t('locFail')); return }
  if(locBusy) return; locBusy=true;
  if(!silent) toast(t('locating'));
  try{
    navigator.geolocation.getCurrentPosition(p=>{
      locBusy=false; store.set('locAsked',true);
      const nl={lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)};
      const moved=!S.loc||kmDist(S.loc.lat,S.loc.lon,nl.lat,nl.lon)>1;
      S.loc=nl; store.set('loc',nl); S.locAt=Date.now(); setTimeout(shareLocationIfAllowed,4000);
      if(moved){S.place=null;S.country=null;S.alertsReady=false}
      render(false); loadWeather();
    },err=>{
      locBusy=false; store.set('locAsked',true);
      if(!silent) toast(err&&err.code===1?t('locDenied'):t('locFail'));
      render(false);
    },{enableHighAccuracy:false,timeout:12000,maximumAge:5*6e4});
  }catch(e){locBusy=false; if(!silent) toast(t('locFail'))}
}

}

function regionKeys(r){for(const [re,k] of REGION_KEYS) if(re.test(r||'')) return k; return r?[r]:[]}
function kmDist(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function quakeAlerts(j,loc){
  return (j.features||[]).map(f=>{
    const [lon,lat]=f.geometry.coordinates, m=f.properties.mag||0, dist=kmDist(loc.lat,loc.lon,lat,lon);
    let level=null;
    if(f.properties.tsunami&&dist<=2000&&m>=6.5) level='warning';
    else if(m>=6&&dist<=1500) level='watch';
    else if((m>=4.5&&dist<=800)||(m>=3&&dist<=250)) level='advisory';
    if(!level) return null;
    const ago=Math.round((Date.now()-f.properties.time)/6e4);
    return {id:'usgs-'+f.id,source:'usgs',level,hazard:f.properties.tsunami?'tsunami':'quake',lat,lon,link:f.properties.url,
      title:{en:`M${m.toFixed(1)} earthquake, ${S.unit==='f'?Math.round(dist*0.6214)+' mi':Math.round(dist)+' km'} away`,ko:`규모 ${m.toFixed(1)} 지진, ${Math.round(dist)}km 거리`},
      body:{en:`${f.properties.place}. ${f.properties.tsunami?'A tsunami may have been generated. Move away from the coast if officials advise it. ':''}If you felt shaking, check for damage and expect aftershocks.`,
            ko:`${f.properties.place}. ${f.properties.tsunami?'지진해일 가능성이 있습니다. 당국이 권고하면 해안에서 벗어나세요. ':''}흔들림을 느꼈다면 피해를 확인하고 여진에 대비하세요.`},
      area:f.properties.place,issued:new Date(f.properties.time).toISOString(),_ago:ago};
  }).filter(Boolean);
}

async function sha(pw){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('safast:'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p'+btoa(unescape(encodeURIComponent(pw)))}}
const demoDB=()=>store.get('demoAccounts',{});
async function initAccounts(){

      for(const m of ['app','auth','firestore']) await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/firebase-${m}-compat.js`);
      firebase.initializeApp(FIREBASE_CONFIG);
      ACC.fb={auth:firebase.auth(),db:firebase.firestore()};
      ACC.fb.auth.onAuthStateChanged(async u=>{
        ACC.user=u?{uid:u.uid,email:(u.email||'').toLowerCase(),verified:!!u.emailVerified,displayName:u.displayName||'',photo:u.photoURL||''}:null;
        ACC.profile=null; ACC.needsProfile=false;
        if(u&&ACC.pending){ACC.profile=ACC.pending}
        else if(u){try{const d=await ACC.fb.db.collection('users').doc(u.uid).get();if(d.exists) ACC.profile=d.data(); else ACC.needsProfile=true}catch(e){ACC.needsProfile=true}}

      });
      return;
    }catch(e){ACC.mode='demo';ACC.fbFailed=true}
  }

  const n=cur().name;

  if(ACC.user&&(n==='login'||n==='signup')){go(S.afterLogin||'/profile');S.afterLogin=null;return}

const Acc={
  async signUp(email,pw,profile){
    email=email.trim().toLowerCase();
    const p={...profile,email,createdAt:Date.now()};
    if(ACC.mode==='firebase'){
      ACC.pending=p;
      try{
        const c=await ACC.fb.auth.createUserWithEmailAndPassword(email,pw);
        await ACC.fb.db.collection('users').doc(c.user.uid).set(p);
        try{await c.user.sendEmailVerification()}catch(e){}
        ACC.profile=p;
      }finally{ACC.pending=null}
      authChanged(); return;
    }
    const db=demoDB();
    if(Object.values(db).some(a=>a.email===email)) throw {code:'auth/email-already-in-use'};
    const uid='demo-'+Date.now().toString(36);
    db[uid]={email,pw:await sha(pw),profile:p}; store.set('demoAccounts',db); store.set('demoSession',uid);
    ACC.user={uid,email,verified:true}; ACC.profile=p; authChanged();
  },
  async google(){
    if(ACC.mode!=='firebase') throw {code:'demo/google'};
    const pr=new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({prompt:'select_account'});
    try{ await ACC.fb.auth.signInWithPopup(pr) }
    catch(e){
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)) return ACC.fb.auth.signInWithRedirect(pr);
      throw e;
    }
  },
  async finishProfile(profile){
    const p={...profile,email:ACC.user.email,createdAt:Date.now()};
    await ACC.fb.db.collection('users').doc(ACC.user.uid).set(p);
    ACC.profile=p; ACC.needsProfile=false; authChanged();
  },
  async signIn(email,pw){
    email=email.trim().toLowerCase();
    if(ACC.mode==='firebase'){await ACC.fb.auth.signInWithEmailAndPassword(email,pw);return}
    const db=demoDB(), h=await sha(pw), uid=Object.keys(db).find(k=>db[k].email===email&&db[k].pw===h);
    if(!uid) throw {code:'auth/invalid-credential'};
    store.set('demoSession',uid); ACC.user={uid,email,verified:true}; ACC.profile=db[uid].profile; authChanged();
  },
  async signOut(){
    if(ACC.mode==='firebase'){ACC.needsProfile=false;await ACC.fb.auth.signOut();return}
    try{localStorage.removeItem('safast:demoSession')}catch(e){} ACC.user=null; ACC.profile=null; authChanged();
  },
  async reset(email){
    if(ACC.mode==='firebase') return ACC.fb.auth.sendPasswordResetEmail(email.trim().toLowerCase());
    throw {code:'demo/no-email'};
  },
  async resendVerify(){ if(ACC.mode==='firebase'&&ACC.fb.auth.currentUser) await ACC.fb.auth.currentUser.sendEmailVerification() },
  async refreshVerify(){
    if(ACC.mode!=='firebase'||!ACC.fb.auth.currentUser) return;
    await ACC.fb.auth.currentUser.reload(); await ACC.fb.auth.currentUser.getIdToken(true);
    ACC.user.verified=!!ACC.fb.auth.currentUser.emailVerified;
  },
  async save(patch){
    const p={...ACC.profile,...patch,updatedAt:Date.now()};
    if(p.guardians) p.guardianEmails=[...new Set(p.guardians.map(g=>(g.email||'').trim().toLowerCase()).filter(Boolean))];
    if(ACC.mode==='firebase') await ACC.fb.db.collection('users').doc(ACC.user.uid).set(p,{merge:true});
    else{const db=demoDB(); if(db[ACC.user.uid]){db[ACC.user.uid].profile=p; store.set('demoAccounts',db)}}
    ACC.profile=p;
  },
  async remove(){
    if(ACC.mode==='firebase'){
      const u=ACC.fb.auth.currentUser;
      await ACC.fb.db.collection('users').doc(u.uid).delete();
      await u.delete(); return;
    }
    const db=demoDB(); delete db[ACC.user.uid]; store.set('demoAccounts',db);
    try{localStorage.removeItem('safast:demoSession')}catch(e){} ACC.user=null; ACC.profile=null; authChanged();
  },
  // People who added this caregiver's email as a guardian and turned sharing on
  async linkedPatients(){
    const me=ACC.user.email;
    if(ACC.mode==='firebase'){
      if(!ACC.user.verified) throw {code:'safast/unverified'};
      const q=await ACC.fb.db.collection('users').where('guardianEmails','array-contains',me).where('shareWithGuardians','==',true).get();
      return q.docs.map(d=>({uid:d.id,...d.data()}));
    }
    const db=demoDB();
    return Object.entries(db).filter(([k,a])=>k!==ACC.user.uid&&a.profile.shareWithGuardians&&(a.profile.guardianEmails||[]).includes(me)).map(([k,a])=>({uid:k,...a.profile}));
  }
};

  'air-quality-magazine':'대기질. 오염을 측정하고 관리하기. 환경 위험 살펴보기. 대기질이 중요한 이유. 오염된 공기는 천식, 기관지염, 만성 폐쇄성 폐질환 같은 호흡기 질환을 일으키거나 악화시킬 수 있습니다. 그런데도 대기오염은 여전히 전 세계에서 가장 큰 환경 위험 중 하나이며, 해마다 수백만 명의 조기 사망에 영향을 줍니다. 나쁜 공기는 생태계도 해칩니다. 황과 질소 배출로 생기는 산성비는 호수, 숲, 토양을 손상시킵니다. 대기질은 기후 변화와도 밀접하게 연결되어 있습니다. 블랙카본과 메탄 같은 많은 오염 물질이 지구 온난화에도 영향을 줍니다. 가장 위험한 사람들. 대기오염은 모두에게 똑같이 영향을 주지 않습니다. 어떤 사람들은 나쁜 공기에 더 취약합니다. 어린이는 어른보다 숨을 빨리 쉬고, 몸무게에 비해 더 많은 공기를 들이마십니다. 폐와 면역 체계도 아직 자라는 중입니다. 노인은 심장이나 폐 질환, 당뇨 같은 질환이 있을 가능성이 높습니다. 천식, 만성 기관지염, 만성 폐쇄성 폐질환, 심혈관 질환이 있는 사람은 더 취약합니다. 임신 중 대기오염에 노출되면 저체중 출산, 조산, 발달 문제와 관련이 있습니다. 경고 신호와 확인 방법. 대기질 지수, 즉 AQI는 공기가 얼마나 오염되었는지와 그에 따른 건강 위험을 알려주는 척도입니다. 나쁜 공기의 신호를 알면 빠르게 대응할 수 있습니다. 흔한 신호로는 스모그, 강한 공장 냄새나 화학 냄새, 시야 감소, 그리고 야외 활동 중 눈이 따갑거나 기침이 나거나 숨이 차는 증상이 있습니다. 날씨 앱, 정부 웹사이트, 지역 뉴스에서 실시간 AQI를 확인할 수 있습니다. 일부 지역에서는 대기질이 위험 수준에 이르면 문자나 알림으로 주민에게 알려줍니다.',
  'emergency-guidelines-for-children':'긴급 상황의 어린이. 아이를 안전하게 지키는 안내서. 자연재해 때 아이를 준비시키고, 보호하고, 돌보는 방법. 긴급 상황에서 아이를 진정시키기. 아이들은 어른의 반응을 따라 합니다. 어른이 침착하면 아이도 안전하다고 느끼고 자신감을 가집니다. 부드럽고 또렷하게 말하세요. 무슨 일이 일어나고 있는지 쉬운 말로 설명하세요. 아이를 곁에 두고 안심시켜 주세요. 장난감이나 담요처럼 마음이 놓이는 물건을 주세요. 기억하세요. 침착한 어른이 아이에게 가장 큰 위안입니다. 상황이 끝나면 부드러운 말로 무슨 일이 있었는지 이야기해 주세요. 그림이나 놀이로 마음을 표현하게 해 주세요. 용기 있게 잘 협조한 것을 칭찬해 주세요. 긴급 상황에서 아이를 강하게 지키기. 긴급 상황은 무서울 수 있지만, 어른이 침착하면 아이도 강해질 수 있습니다. 무서워해도 괜찮다고 알려주세요. 침착하게 안심시켜 주세요. 용기를 칭찬해 주세요. 도와주는 사람들이 항상 곁에 있다고 말해 주세요. 함께라면 두려움을 용기로 바꿀 수 있습니다. 긴급 상황이 끝난 뒤. 재난이 지나간 뒤에도 아이는 안전한데도 불안하거나 슬플 수 있습니다. 마음을 이야기하도록 도와주면 더 나아지고 강해집니다. 인내심을 가지세요. 들어주고 위로해 주세요. 필요하면 도움을 받으세요. 소아과 의사가 전문가를 소개해 줄 수 있습니다. 아이에게 말해 주세요. 마음이 낫는 데는 저마다 시간이 걸린다고요. 준비하고, 안전하게. 준비된 가족이 안전합니다. 가족 계획서를 찾기 쉬운 곳에 두세요. 비상 키트는 1년에 두 번 점검하세요. 함께 훈련하고, 재미있게 해 보세요. 준비가 가족을 강하게 만듭니다. 안전은 침착함, 돌봄, 그리고 연결에서 시작됩니다.',
  'emergency-guidelines-for-people-with-disabilities':'준비하고 보호받기. 자연재해 때 장애가 있는 분을 위한 안내서. 재난 전, 중, 후에 안전을 지키는 간단한 방법. 대비가 중요한 이유. 재난은 사람마다 다르게 영향을 줍니다. 성인 네 명 중 한 명은 장애가 있으며, 홍수, 화재, 태풍, 지진 같은 상황에서 더 많은 어려움을 겪을 수 있습니다. 스스로를 지키면 스트레스를 줄이고, 건강과 자립을 지키며, 생명도 구할 수 있습니다. 나를 가장 잘 대변하는 사람은 바로 나입니다. 준비하기. 비상 키트로 미리 계획하세요. 지역 긴급 서비스를 알아두세요. 대피 계획을 세우세요. 대피 경로를 연습하세요. 자연재해가 일어났을 때. 침착하게 실내에 머무르세요. 비상 계획을 따르세요. 비상 키트를 사용하세요. 최신 정보를 확인하세요. 긴급 상황에서 도움 받기. 구조대원에게 장애에 대해 알려주세요. 어떻게 도와줄 수 있는지 말해 주세요. 꼭 필요한 장비는 가능하면 가져가세요. 나와 구조대원을 위해 메모를 남기세요. 미리 계획하기. 비상 계획을 만드세요. 대피 경로를 알아두세요. 비상 가방을 준비하세요.',
  'emergency-guidelines-for-pets':'긴급 상황의 반려동물. 반려동물을 안전하게 지키는 안내서. 자연재해 때 반려동물을 준비시키고, 보호하고, 돌보는 방법. 반려동물 대비가 중요한 이유. 홍수, 산불, 폭염, 태풍 같은 재난은 반려동물에게도 위험합니다. 해마다 많은 반려동물이 재난 중에 길을 잃거나 구조됩니다. 지금 계획을 세우세요. 반려동물의 생명을 구할 수 있습니다. 재난 전. 반려동물 비상 계획을 세우세요. 인식표와 마이크로칩 정보를 최신으로 유지하세요. 사료, 물, 약, 목줄, 이동장 등 필수품으로 비상 키트를 준비하세요. 반려동물을 받아주는 대피소나 숙소를 포함한 대피 계획을 세우세요. 동물병원 기록과 반려동물 사진을 복사해 두세요. 팁: 반려동물을 이동장에 넣는 연습을 해 두세요. 긴급 상황이 될 때까지 기다리지 마세요. 재난 중. 침착하게 반려동물을 안전하게 지키세요. 대피하거나 실내에 머물 때는 항상 목줄을 하거나 이동장에 넣으세요. 두고 가지 마세요. 더위, 홍수, 유독한 잔해 같은 위험을 살피세요. 화재 때는 이동장을 수건으로 덮어 진정시키세요. 홍수 때는 높은 곳으로 옮기세요. 폭풍 때는 안전한 방을 마련하세요. 재난 후. 다친 곳이나 스트레스가 없는지 살피세요. 두려움, 공격성, 숨는 행동 같은 변화를 지켜보세요. 반려동물과 떨어졌다면 지역 보호소에 연락하세요. 오염된 물이나 잔해를 피하세요. 팁: 집에 천천히 다시 적응시키세요. 익숙한 냄새가 불안을 줄여줍니다. 자료와 빠른 참고. 긴급 연락처로는 지역 동물 보호소, ASPCA, FEMA 반려동물 자료가 있습니다. 반려동물은 여러분에게 의지합니다. 오늘 준비하면 내일 안전할 수 있습니다.',
  'extreme-heat-guidelines':'폭염에서 안전하게 지내세요. 폭염은 탈수, 열탈진, 열사병을 일으킬 수 있습니다. 가장 위험한 사람: 노인, 어린이, 만성 질환이 있는 분, 야외 근로자. 증상: 두통, 어지럼증, 근육 경련, 정신 혼미, 메스꺼움. 예방 방법: 시원하게 지내세요. 물을 충분히 마시세요. 하루 일정을 미리 계획하세요. 응급 조치: 911에 전화하세요. 물을 마시게 하세요. 시원하고 젖은 천을 대 주세요.',
  'flood-risk-magazine':'불어나는 물. 홍수 위험 이해하기. 안전하게, 준비하고, 회복력 있게. 홍수가 위험한 이유. 홍수는 미국에서 가장 흔하고 피해가 큰 자연재해입니다. 부상, 재산 피해, 전기와 수도 같은 기반 시설 중단을 일으킬 수 있습니다. 기후 변화로 홍수는 더 잦아지고 더 심해지고 있습니다. 홍수가 늘수록 비용은 커지고 복구는 길어집니다. 가장 위험한 사람들. 누구나 홍수의 영향을 받을 수 있지만, 신체적, 경제적, 환경적 이유로 특히 취약한 사람들이 있습니다. 노인, 거동이 불편한 분, 저소득 가구, 홍수 위험 지역 주민이 특히 위험합니다. 경고 신호와 알림. 빠른 경고가 생명을 구합니다. 홍수 주의보는 홍수가 날 수 있는 조건이라는 뜻입니다. 높은 곳으로 이동할 준비를 하세요. 홍수 경보는 홍수가 일어나고 있거나 임박했다는 뜻입니다. 즉시 행동하세요. 개울이나 배수로가 빠르게 차오르거나, 물이 도로를 덮거나, 물 색깔이나 흐름이 갑자기 바뀌면 모두 위험 신호입니다. SAFAST와 NOAA 기상 라디오에 가입하세요. 사이렌, 마을 방송, 당국의 안내를 잘 들으세요. 예방과 집 보호. 비를 막을 수는 없지만, 홍수 피해를 줄이고 가족을 더 안전하게 지킬 수 있습니다. 설비를 높이세요. 보일러, 온수기, 전기 분전반을 예상 침수 높이보다 위로 옮기세요. 틈을 막으세요. 지하 벽과 기초에 방수재를 바르세요. 역류 방지 밸브를 달아 하수 역류를 막으세요. FEMA나 지역 홍수 위험 지도를 확인하세요. 주택 보험이나 세입자 보험을 확인하세요. 일반 보험은 대개 홍수 피해를 보장하지 않습니다. 중요한 서류는 방수 용기에 보관하세요. 사흘 치 물, 음식, 약으로 비상 키트를 준비하세요. 대피 경로를 정하고 가족과 함께 연습하세요. 홍수가 났을 때. 물이 차오르기 시작하면 1분 1초가 중요합니다. 당국이 대피하라고 하면 대피하세요. 높은 곳으로 이동하세요. 침수된 지하에 절대 머무르지 마세요. 약, 신분증, 필수품을 챙기세요. 시간이 있으면 가전제품 플러그를 뽑으세요. 물속을 걷거나 운전하지 마세요. 흐르는 물 15센티미터에 사람이 넘어지고, 30센티미터면 차가 떠내려갈 수 있습니다. 숨은 잔해, 끊어진 전선, 오염에 주의하세요. 배터리 라디오나 휴대폰으로 소식을 확인하세요. 통신망이 막히지 않도록 가능하면 전화 대신 문자를 보내세요.',
  'mosquito-bites-guidelines':'모기에 물리지 않도록 자신을 지키세요. 모기는 웨스트나일 바이러스, 지카, 뎅기열 같은 질병을 옮길 수 있습니다. 자신을 지키면 나와 이웃 모두가 안전해집니다. 가장 위험한 사람: 노인, 어린이, 만성 질환이 있는 분, 야외 근로자. 물린 뒤 증상: 열, 두통, 발진, 관절 통증. 이 중 하나라도 있으면 바로 진료를 받으세요. 예방 방법: 모기 기피제를 바르세요. 긴 옷을 입으세요. 모기가 많은 시간대를 피하세요.',
  'protection-against-floods-guidelines':'홍수 때 안전하게 지내세요. 홍수 전: 내 위험을 알아두세요. 우리 동네가 침수 위험 지역인지 확인하세요. 비상 키트를 준비하세요. 물, 음식, 손전등, 약, 서류. 알림을 신청하세요. SAFAST, 날씨 앱, 지역 재난 알림. 홍수 중: 물을 피하세요. 침수된 곳 근처를 걷거나 헤엄치지 마세요. 높은 곳으로 이동하세요. 위층이나 더 안전한 곳으로 가세요. 당국의 안내를 따르세요. 대피하라고 하면 대피하세요. 홍수 후: 침수된 곳을 피하세요. 물이 오염되었거나 위험한 것이 숨어 있을 수 있습니다. 끊어진 전선을 피하세요. 발견하면 바로 신고하세요.',
  'psychological-coping-guidelines':'재난에 대처하고 회복력 기르기. 안전하게, 준비하고, 회복력 있게. 자연재해든, 기술적 사고든, 사람이 일으킨 재난이든, 재난은 삶을 갑자기 압도적으로 흔들 수 있습니다. 물리적 피해를 넘어 마음의 건강에도 깊은 영향을 줍니다. 불안, 혼란, 분노, 집중하기 어려움, 잠들기 어려움은 비정상적인 사건에 대한 아주 자연스러운 스트레스 반응입니다. 당장의 스트레스를 다루는 데는 작은 행동이 도움이 됩니다. 천천히 깊게 숨을 쉬어 몸과 마음을 진정시키세요. 먹고, 쉬고, 자는 시간을 일정하게 지키세요. 필요할 때는 뉴스에서 잠시 벗어나고, 공식적으로 확인된 정보만 믿으세요. 작고 할 수 있는 일에 집중하며 마음을 편안하게 하는 활동을 하세요. 그러면 다시 통제감을 찾을 수 있습니다. 차근차근 실천하면 장기적인 회복력과 마음의 회복도 쌓입니다. 물을 마시고, 몸을 움직이고, 회복할 시간을 주며 몸의 건강을 먼저 챙기세요. 친구, 가족, 이웃과 솔직하게 이야기하거나 지역 복구 활동에 참여하며 다시 연결되세요. 그리고 여유가 될 때 다른 사람을 도우면 함께 치유하고 나아갈 수 있습니다. 마지막으로, 언제 도움을 받아야 하는지 알고 필요할 때마다 손을 내미세요. 슬픔이 계속되거나, 불안이 너무 크거나, 일상생활이 계속 힘들다면 의료 전문가, 상담 기관, 트라우마 전문 기관에 도움을 요청하세요. 혼자 견디지 않아도 됩니다. 도움은 언제나 있습니다.',
  'did-you-know-series-part-1':'그래니트 주의 가장 큰 위험: 환경 위험 이해하기. 안전하게, 준비하고, 회복력 있게. 강 범람은 뉴햄프셔에서 가장 흔한 자연재해입니다. 2006년 5월 어머니날 폭우 때는 뉴햄프셔 중부와 남부에 72시간 동안 300밀리미터가 넘는 비가 내려 도로와 다리에 수백만 달러의 피해를 냈습니다. 지역 분석에 따르면 엑서터는 특히 500년 빈도 홍수에서 심각한 위험 점수를 받았습니다. 겨울 날씨와 해안 변화도 주 전역에 계속 큰 어려움을 줍니다. 1980년부터 2024년까지 뉴햄프셔는 피해 지역 전체에서 각각 10억 달러가 넘는 손실을 낸 겨울 폭풍을 11번 겪었습니다. 봄에는 얼음 덩어리가 강의 흐름을 막아 상류나 하류에 갑작스러운 돌발 홍수를 일으킬 수 있고, 1978년 2월의 해안 홍수는 뉴햄프셔 해안 역사상 가장 심각한 홍수 중 하나로 남아 있습니다. 강풍과 허리케인도 이 지역의 환경 역사를 바꿔 왔습니다. 1934년 4월 12일 워싱턴산에서는 시속 약 372킬로미터의 지상 풍속이 기록되었는데, 세계에서 측정된 가장 강한 바람 중 하나입니다. 1938년 롱아일랜드 익스프레스 허리케인은 뉴햄프셔를 강타해 13명이 숨지고 강 유역에 큰 홍수를 일으켰으며, 2011년 허리케인 아이린과 2012년 샌디 같은 최근 위협도 심한 침식, 배수관 파손, 광범위한 홍수와 피해를 남겼습니다. 엑서터에서는 홍수가 가장 큰 환경 위협으로 100점 중 73점의 심각한 위험 점수를 받았기 때문에 안전을 지키는 것이 매우 중요합니다. 전문가들은 재난 후 긴급 구조대가 바쁠 수 있으므로 최소 72시간, 즉 사흘 동안 스스로 버틸 수 있도록 준비하라고 권합니다. 기본 비상 키트에는 한 사람당 하루 약 4리터의 물, 상하지 않는 음식, 배터리 라디오가 있어야 합니다.',
  'did-you-know-series-part-2':'안전하게, 준비하고, 회복력 있게. 따뜻한 공기는 더 많은 수분을 머금습니다. 기온이 1도 오를 때마다 대기는 수증기를 약 7퍼센트 더 머금을 수 있어, 2006년의 300밀리미터 폭우 같은 집중호우로 이어집니다. 게다가 미국 북동부의 해수면은 세계 평균보다 빠르게 오르고 있어, 평범한 만조가 해안 마을에 맑은 날 침수를 일으킵니다. 겨울은 짧아지고 있지만, 따뜻한 공기에 수분이 더 많아 폭풍 하나하나는 더 강해질 수 있습니다. 기상 특보의 차이를 아는 것은 제때 대응하는 데 아주 중요합니다. 주의보는 재난이 일어날 조건이 갖춰졌다는 뜻이니 경계하세요. 경보는 재난이 일어나고 있거나 임박했다는 뜻이니 지금 행동하세요. 며칠에 걸쳐 천천히 불어나는 강 범람과 달리, 돌발 홍수는 폭우 후 몇 분 만에 일어날 수 있으며, 특히 언덕 지형이나 포장된 도시 지역에서 그렇습니다. 또한 혹한 뒤에 갑자기 날이 풀리면 강 수위를 잘 살피세요. 얼음 덩어리가 댐처럼 막아 몇 분 만에 물이 수십 센티미터 불어날 수 있습니다. 악천후 중과 후에 올바르게 대비하면 생명을 구할 수 있습니다. 홍수 사망자는 대부분 차 안에서 발생하니, 물에 잠긴 길은 돌아가세요. 흐르는 물 15센티미터에 사람이 넘어지고, 30센티미터면 대부분의 차가 떠내려갑니다. 강풍이 불 때 가장 안전한 곳은 집의 가장 낮은 층, 창문과 바깥벽에서 떨어진 곳입니다. 마지막으로, 부상은 대부분 폭풍이 지나간 뒤에 일어난다는 것을 기억하세요. 엑서터 같은 고위험 지역에서는 끊어진 전선, 쓰러질 듯한 나무, 침수된 지하의 보이지 않는 곰팡이를 조심하세요.',
  'did-you-know-series-part-3':'지진이 단단한 땅을 액체처럼 흐르게 만든다는 것, 알고 계셨나요? 지진이 일어나면 단단한 땅이 갑자기 액체처럼 변해 건물 전체가 부서지지 않은 채 가라앉거나 기울어질 수 있습니다. 이를 액상화라고 합니다. 단단해 보이던 흙이 유사처럼 변하고, 무거운 건물은 가라앉는 반면 땅속 배관이나 저장 탱크는 지면 위로 떠오르기도 합니다. 액상화는 모래나 실트처럼 느슨하고 물을 머금은 흙에서 일어납니다. 평소에는 흙 알갱이들이 서로 맞닿아 마찰로 무게를 버팁니다. 그런데 지진파가 지나가면 알갱이 사이의 물 압력이 높아져 알갱이들이 서로 밀려나고, 흙이 힘을 잃게 됩니다.',
  'did-you-know-series-part-4':'지진해일이 오기 전에 바닷물이 빠져나간다는 것, 알고 계셨나요? 지진해일이 해안에 닿기 전, 바다가 빠져나가는 것처럼 보이면서 물고기와 산호초가 해저에 그대로 드러나곤 합니다. 이 현상을 물빠짐이라고 합니다. 물은 수백 미터까지 물러날 수 있으며, 보통 거대한 파도가 도착하기 겨우 5분에서 10분 전에 일어납니다. 지진해일은 파장이 아주 긴 여러 개의 파도입니다. 파도의 가장 낮은 부분인 골이 마루보다 먼저 얕은 해안에 닿으면, 거대한 진공청소기처럼 해안의 물을 파도 중심 쪽으로 끌어당깁니다. 바닷물이 갑자기 빠지면 곧바로 높은 곳으로 대피하세요.',
  'did-you-know-series-part-5':'번개가 태양 표면보다 다섯 배나 뜨겁다는 것, 알고 계셨나요? 땅에서 보면 번쩍하는 빛일 뿐이지만, 번개 한 줄기는 태양 표면보다 훨씬 뜨겁습니다. 태양 표면은 약 섭씨 5,500도인데, 번개는 약 섭씨 30,000도까지 올라가 약 다섯 배나 뜨겁습니다. 이 엄청난 열은 저항에서 나옵니다. 전기 방전이 전기가 잘 통하지 않는 공기를 억지로 뚫고 지나가면서, 마찰과 빠르게 움직이는 전자들이 순식간에 엄청난 열을 만들어냅니다.',
  'did-you-know-series-part-6':'산불이 평지보다 언덕을 훨씬 빠르게 올라간다는 것, 알고 계셨나요? 산불은 평지나 내리막보다 오르막에서 훨씬 빠르게 번져, 완만한 비탈도 몇 초 만에 위험한 곳이 될 수 있습니다. 경사가 10도 오를 때마다 불의 속도는 두 배가 될 수 있습니다. 평지에서 꾸준히 타던 불도 굴뚝 같은 협곡이나 가파른 산비탈에 닿는 순간 생명을 위협하는 속도로 폭발할 수 있습니다. 이는 예열이라는 과정 때문입니다. 열과 연기는 위로 올라가기 때문에, 비탈에서는 불꽃이 위쪽 연료와 더 가깝습니다. 그래서 위로 올라가는 열이 불이 직접 닿기도 전에 위쪽 풀과 나무를 말리고 불을 붙입니다.',
  'did-you-know-series-part-7':'뇌우 위에 거대한 빛의 해파리가 떠 있다는 것, 알고 계셨나요? 뇌우 위로 우주 가장자리를 향해 뻗는 거대한 해파리 모양의 붉은 빛이 나타나는데, 수십 년 동안 이를 목격했다는 조종사들의 말은 믿어지지 않았습니다. 레드 스프라이트라고 불리는 이 전기 방전은 폭이 최대 50킬로미터에 이릅니다. 몇 천분의 1초 동안만 나타나 맨눈으로 보기에는 너무 빨라서 오랫동안 전설로 여겨졌습니다. 스프라이트는 구름과 땅 사이에 치는 강한 번개로 생겨납니다. 전기적 불균형이 두 번째 방전을 일으키고, 이 방전이 대기 중 질소와 반응해 폭풍 높이 위에서 선명한 붉은빛을 냅니다.',
  'did-you-know-series-part-8':'지구 화산 폭발 대부분이 바닷속에서 일어난다는 것, 알고 계셨나요? 지구 화산 폭발의 대부분, 약 70에서 80퍼센트는 아무도 볼 수 없는 깊은 바닷속에서 일어납니다. 해저에는 백만 개가 넘는 화산이 있는 것으로 추정됩니다. 너무 깊은 곳에 있어 엄청난 바닷물의 무게가 폭발을 막기 때문에, 위성이나 음파로도 거의 감지되지 않습니다. 이 화산들은 대부분 판이 서로 멀어지는 중앙 해령을 따라 있습니다. 판이 벌어지면 마그마가 올라와 틈을 메우며 새로운 해저를 만드는데, 이 경계에서는 지각이 가장 얇아 마그마가 빠져나오기 가장 쉽기 때문입니다.',
  'did-you-know-series-part-9':'토네이도가 사람이 들을 수 없는 소리를 낸다는 것, 알고 계셨나요? 토네이도는 화물 열차 같은 소리로 유명하지만, 사람이 들을 수 없는 소리도 냅니다. 들리는 굉음은 잔해와 바람 때문이지만, 토네이도는 20헤르츠보다 낮아 사람의 귀로는 들을 수 없는 초저주파도 냅니다. 초저주파는 토네이도의 중심에서 만들어집니다. 소용돌이가 흔들리고 깔때기 안의 기압이 빠르게 떨어지면서 강한 음향 진동이 생깁니다. 이런 긴 파장의 소리는 우리가 듣는 높은 소리와 달리 에너지를 잃지 않고 수백 킬로미터를 이동할 수 있습니다.',
  'did-you-know-series-part-10':'화산이 시속 160킬로미터로 콘크리트 강을 쏟아낼 수 있다는 것, 알고 계셨나요? 화산은 용암을 내뿜지 않아도 치명적일 수 있습니다. 라하르라고 불리는 거대한 콘크리트 강이 시속 160킬로미터로 흘러내릴 수 있기 때문입니다. 라하르는 젖은 시멘트 같은 화산 이류입니다. 물보다 훨씬 밀도가 높아 집채만 한 바위도 실어 나르며, 1985년 콜롬비아 네바도 델 루이스 화산의 라하르는 정상에서 수 킬로미터 떨어진 마을 하나를 통째로 묻어버렸습니다. 라하르는 화산의 열이, 완전한 폭발이 없어도, 정상의 빙하나 눈을 빠르게 녹일 때 생깁니다. 이 엄청난 물이 비탈의 느슨한 화산재와 돌과 섞여 빠르게 흐르는 진흙 물결이 됩니다.',
  'did-you-know-series-part-11':'가뭄이 홍수보다 더 많은 사람의 목숨을 앗아간다는 것, 그것도 아주 천천히, 알고 계셨나요? 가뭄은 서서히 다가오는 재난이라고 불립니다. 전 세계적으로 홍수나 허리케인보다 더 많은 사람이 가뭄으로 목숨을 잃지만, 아주 천천히 일어나기 때문입니다. 갑작스러운 지진과 달리 가뭄은 수십 년 동안 이어질 수 있습니다. 과학자들은 20년에서 40년 넘게 이어져 문명 전체를 바꾼 역사 속 대가뭄을 찾아냈습니다. 가뭄은 흔히 라니냐 같은 바다 수온 변화로 생기는데, 이 변화가 수분을 실어 나르는 높은 하늘의 바람인 제트기류를 움직입니다. 제트기류가 바뀌면 고기압이 몇 년 동안 한 지역 위에 머물며 뚜껑처럼 비구름을 막아버립니다.',
  'did-you-know-series-part-12':'지진이 하루의 길이를 줄일 수 있다는 것, 알고 계셨나요? 큰 지진은 지구의 하루 길이를 실제로 바꿔, 지구를 아주 조금 더 빨리 돌게 만들 수 있습니다. 예를 들어 2011년 규모 9.1의 일본 지진은 하루를 약 1.8마이크로초 줄였고, 2004년 수마트라 지진은 약 6.8마이크로초 줄였습니다. 이는 각운동량 보존, 이른바 피겨 스케이터 효과 때문입니다. 지진으로 무거운 판이 지구 중심 쪽으로 움직이면 지구의 질량이 안쪽으로 모이고, 회전하던 스케이터가 팔을 오므리면 더 빨리 도는 것처럼 지구도 더 빨리 돌게 됩니다.',
  'did-you-know-series-part-13':'마른번개는 사실 존재하지 않는다는 것, 알고 계셨나요? 더운 날씨 때문에 생기는 특별한 번개라고 여겨지는 마른번개는, 사실 평범한 뇌우가 우리 눈과 귀를 속이는 것일 뿐입니다. 우리가 마른번개라고 부르는 것은 천둥소리가 들리지 않을 만큼 먼 곳에서 친 뇌우의 빛입니다. 빛은 소리보다 훨씬 멀리 가기 때문에 160킬로미터 떨어진 폭풍의 번쩍임도 볼 수 있지만, 천둥은 보통 16에서 24킬로미터만 지나도 사라집니다. 지구가 둥글고, 소리가 온도가 다른 공기층을 지나면서 위로 꺾이거나 흡수되기 때문에 천둥은 우리에게 닿지 못하고, 지평선의 조용한 번쩍임만 남게 됩니다.'
};

  'hurricane-helene':{region:'미국 남동부',text:'허리케인 헐린은 상륙 지점에서 멀리 떨어진 내륙에 엄청난 피해를 낸 것으로 주목받습니다. 해안 지역은 예상된 폭풍해일을 겪었지만, 진짜 위험은 애팔래치아산맥에 쏟아진 극한 폭우였습니다. 이미 물을 잔뜩 머금은 땅이 무너지면서 대규모 산사태와 돌발 홍수가 일어나 산간 마을 전체를 쓸어버렸습니다. 허리케인의 가장 치명적인 위협이 언제나 해안의 바람은 아니며, 수백 킬로미터 내륙까지 따라오는 비일 수 있다는 것을 일깨워 줍니다.',lesson:'해안뿐 아니라 내륙 지역도 허리케인에 대비한 홍수 계획이 필요합니다.'},

  'siberian-wildfires':{region:'러시아 사하 공화국(야쿠티아)',text:'이 산불은 엄청난 규모와, 보통은 너무 춥고 습해 이런 일이 일어나지 않는 북극권이라는 위치 때문에 주목받았습니다. 위험은 두 가지였습니다. 넓은 생태계가 곧바로 파괴되었고, 녹는 영구동토층에 저장되어 있던 탄소와 메탄이 대량으로 뿜어져 나오는 이른바 탄소 폭탄이 터졌습니다. 산불의 열이 영구동토층을 더 녹이고, 더 많은 온실가스가 대기로 나와 지구 온난화를 앞당기는 위험한 악순환이 만들어졌습니다.',lesson:'추운 지역의 온난화는 사람들이 가장 예상하지 못한 곳에 산불 위험을 만듭니다.'},
  'black-summer':{region:'호주 남동부',text:'이 시기는 산불의 양상이 바뀐 때였습니다. 불이 너무 강해 화재적란운이라는 자체 기상 현상을 만들어냈습니다. 이 구름이 만든 불 번개가 원래 불길에서 몇 킬로미터 떨어진 곳에 새로운 불을 붙였습니다. 극심한 더위와 건조함 때문에 불은 거의 잡을 수 없었고, 수십억 마리의 동물이 희생되었으며, 따뜻해지는 세계에서 생물 다양성과 사람이 사는 곳이 얼마나 취약한지를 보여주었습니다.',lesson:'일찍 떠나세요. 불이 어떻게 번지는지 지켜보며 기다리는 것이 가장 위험합니다.'},

  'brazil-floods':{region:'브라질 히우그란지두술주',text:'히우그란지두술주에서는 몇 주 동안 이어진 비로 강물이 역사상 기록된 적 없는 높이까지 올라갔습니다. 이 재난의 위험은 홍수가 오래 지속되었다는 점입니다. 물이 몇 주 동안 높게 머물며 주도를 모든 물자, 전기, 깨끗한 물로부터 끊어놓았습니다. 정체된 기상 패턴이 한 지역에 비를 계속 붙잡아두면, 감당할 수 있는 홍수가 사회 전체의 마비로 바뀌고 수천 명이 영영 다른 곳으로 옮겨야 할 수 있음을 보여주었습니다.',lesson:'홍수가 반복되면 피해가 쌓입니다. 한 번 겪을 때마다 다음 홍수를 견디는 힘이 약해집니다.'},
